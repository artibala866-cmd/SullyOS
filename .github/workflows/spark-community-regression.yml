name: Spark community regression
on:
  push:
    branches:
      - fix/spark-community-stability-20261028
  pull_request:
    paths:
      - apps/SocialApp.tsx
      - utils/db.ts
      - types.ts
      - utils/socialFeedMerge.ts
      - utils/socialFeedMerge.test.ts
      - utils/socialGeneration.ts
      - utils/sparkCommunity.ts
      - utils/sparkCommunity.test.ts
      - utils/sparkTraffic.ts
      - utils/sparkDMQueue.ts
      - utils/sparkDMQueue.test.ts
permissions:
  contents: read
jobs:
  spark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck Spark files without hiding unrelated pre-existing errors
        shell: bash
        run: |
          pnpm exec tsc --noEmit --pretty false > /tmp/spark-tsc.log 2>&1 || true
          grep -E '^(apps/SocialApp.tsx|utils/sparkCommunity.ts|utils/socialFeedMerge.ts|utils/socialGeneration.ts|utils/sparkTraffic.ts|utils/sparkCommunity.test.ts|utils/socialFeedMerge.test.ts|utils/sparkDMQueue.ts|utils/sparkDMQueue.test.ts|utils/socialGeneration.test.ts|utils/db.ts|types.ts)[(]' /tmp/spark-tsc.log > /tmp/spark-errors.log || true
          if [ -s /tmp/spark-errors.log ]; then
            cat /tmp/spark-errors.log
            exit 1
          fi
          echo "Spark target files have no TypeScript diagnostics."
      - run: pnpm exec vitest run utils/socialFeedMerge.test.ts utils/socialGeneration.test.ts utils/sparkCommunity.test.ts utils/sparkTraffic.test.ts utils/sparkDMQueue.test.ts
      - name: Verify production application bundles
        run: pnpm run build
