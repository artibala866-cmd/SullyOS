name: Spark community regression
on:
  push:
    branches:
      - fix/spark-community-stability-20261028
  pull_request:
    paths:
      - apps/SocialApp.tsx
      - types.ts
      - utils/socialFeedMerge.ts
      - utils/socialFeedMerge.test.ts
      - utils/socialGeneration.ts
      - utils/sparkCommunity.ts
      - utils/sparkCommunity.test.ts
      - utils/sparkTraffic.ts
permissions:
  contents: read
jobs:
  spark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run utils/socialFeedMerge.test.ts utils/socialGeneration.test.ts utils/sparkCommunity.test.ts utils/sparkTraffic.test.ts
