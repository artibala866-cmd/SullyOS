name: Tavern Character Card Import Regression
on:
  push:
    branches: [remove-checkphone-vrworld-lifesim]
    paths:
      - 'apps/Character.tsx'
      - 'apps/UserApp.tsx'
      - 'utils/importTextDocument.ts'
      - 'utils/importTextDocument.test.ts'
      - 'utils/pdfText.ts'
      - 'utils/pdfText.test.ts'
      - 'utils/sillyTavernCard.ts'
      - 'utils/cardImportMerge.ts'
      - 'utils/characterCardBatch.ts'
      - 'utils/characterCardBatch.test.ts'
      - 'utils/cardImportMerge.test.ts'
      - 'utils/cardImportRemark.ts'
      - 'utils/cardImportRemark.test.ts'
      - 'utils/cardImportSections.ts'
      - 'utils/cardImportSections.test.ts'
      - 'utils/babyLinkCard.ts'
      - 'utils/linkImportDocuments.ts'
      - 'utils/linkImportDocuments.test.ts'
      - 'utils/linkWorldbookImport.ts'
      - 'utils/linkWorldbookImport.test.ts'
      - 'utils/worldbookImportPlan.ts'
      - 'utils/worldbookImportPlan.test.ts'
      - 'utils/db.worldbookImportAtomic.test.ts'
      - 'context/OSContext.tsx'
      - 'apps/WorldbookApp.tsx'
      - 'utils/babyLinkCard.test.ts'
      - 'utils/linkStoryOpenings.ts'
      - 'utils/linkImportIntegration.test.ts'
      - 'utils/characterImageProfile.ts'
      - 'utils/imageGeneration.ts'
      - 'utils/imageGeneration.test.ts'
      - 'components/character/CharacterImagePanel.tsx'
      - 'utils/sillyTavernCard.test.ts'
      - 'utils/tavernOpeningGreeting.ts'
      - 'utils/tavernOpeningGreeting.test.ts'
      - 'utils/storyTheater.ts'
      - 'utils/storyTheaterPersistence.ts'
      - 'utils/storyTheaterOpeningInline.test.tsx'
      - 'components/date/story/StoryTheater.tsx'
      - 'components/date/story/StoryTheaterEditor.tsx'
      - 'components/date/story/StoryTheaterSession.tsx'
      - 'utils/db.ts'
      - 'utils/worldbook.ts'
      - 'utils/pngShare.ts'
      - '.github/workflows/tavern-character-card.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tavern-character-card-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regression tests for card imports and context worldbooks
        run: pnpm exec vitest run utils/characterCardBatch.test.ts utils/importTextDocument.test.ts utils/pdfText.test.ts utils/linkImportDocuments.test.ts utils/linkWorldbookImport.test.ts utils/worldbookImportPlan.test.ts utils/db.worldbookImportAtomic.test.ts utils/cardImportSections.test.ts utils/cardImportMerge.test.ts utils/cardImportRemark.test.ts utils/babyLinkCard.test.ts utils/linkImportIntegration.test.ts utils/sillyTavernCard.test.ts utils/tavernOpeningGreeting.test.ts utils/storyTheaterOpeningInline.test.tsx utils/storyTheaterPersistence.test.ts utils/storyTheater.test.ts utils/characterCard.test.ts utils/worldbook.test.ts utils/worldbookPersistence.test.ts utils/contextWorldbook.test.ts utils/imageGeneration.test.ts
      - name: TypeScript diagnostics on imported-card surfaces
        shell: bash
        run: |
          pnpm exec tsc --noEmit --pretty false > /tmp/tavern-tsc.log 2>&1 || true
          grep -E '^(apps/Character.tsx|apps/UserApp.tsx|apps/WorldbookApp.tsx|context/OSContext.tsx|components/character/CharacterImagePanel.tsx|components/date/story/StoryTheater(Editor|Session)?.tsx|utils/(characterCardBatch(\.test)?|importTextDocument(\\.test)?|pdfText(\\.test)?|linkImportDocuments(\.test)?|linkWorldbookImport(\.test)?|worldbookImportPlan(\.test)?|db\.worldbookImportAtomic\.test|cardImportSections(\.test)?|cardImportMerge(\.test)?|cardImportRemark(\.test)?|babyLinkCard(\.test)?|sillyTavernCard(\.test)?|tavernOpeningGreeting(\.test)?|storyTheater(OpeningInline|Persistence)?(\.test)?|imageGeneration(\.test)?|characterImageProfile|db|worldbook|pngShare).ts)[(]' /tmp/tavern-tsc.log > /tmp/tavern-errors.log || true
          if [ -s /tmp/tavern-errors.log ]; then
            cat /tmp/tavern-errors.log
            exit 1
          fi
          echo "Imported card files have no TypeScript diagnostics."
      - name: Build application
        run: pnpm run build
