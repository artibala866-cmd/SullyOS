name: Phone WeChat official service feed visual
on:
  push:
    branches: [remove-checkphone-vrworld-lifesim]
    paths:
      - 'components/chat/PhoneWeChatServiceFeed.tsx'
      - 'components/chat/CharacterPhone.tsx'
      - 'utils/characterPhoneChats.ts'
      - 'utils/phoneWeChatServiceFeed.test.ts'
      - 'tests/phone-wechat-service-visual.*'
      - '.github/workflows/phone-wechat-service-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phone-wechat-service-visual
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test two account layouts and persisted message compatibility
        run: pnpm exec vitest run utils/phoneWeChatServiceFeed.test.ts
      - name: Build application
        run: pnpm run build
      - name: Check changed component TypeScript
        shell: bash
        run: |
          pnpm exec tsc --noEmit --pretty false > /tmp/wechat-feed-tsc.log 2>&1 || true
          grep -E '^(components/chat/(PhoneWeChatServiceFeed|CharacterPhone)\.tsx|utils/(phoneWeChatServiceFeed\.test|characterPhoneChats)\.ts|tests/phone-wechat-service-visual\.tsx)[(]' /tmp/wechat-feed-tsc.log > /tmp/wechat-feed-target-errors.log || true
          if [ -s /tmp/wechat-feed-target-errors.log ]; then cat /tmp/wechat-feed-target-errors.log; exit 1; fi
      - name: Install Chinese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Render actual React service and official feed screens at 390px
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vite --host 127.0.0.1 --port 5173 --strictPort >/tmp/wechat-service-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          url='http://127.0.0.1:5173/tests/phone-wechat-service-visual.html'
          for i in $(seq 1 60); do if curl -fsS "$url" >/dev/null; then break; fi; sleep 1; done
          chrome="${{ steps.chrome.outputs.chrome-path }}"
          for view in service official; do
            "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,950 --force-device-scale-factor=1 --virtual-time-budget=11000 --dump-dom "$url?view=$view" > "/tmp/wechat-$view-dom.txt" 2>/tmp/wechat-$view-chrome.log || true
            if ! grep -q 'data-ready="true"' "/tmp/wechat-$view-dom.txt"; then
              grep -o '<output[^>]*>[^<]*</output>' "/tmp/wechat-$view-dom.txt" || true
              tail -35 /tmp/wechat-service-vite.log || true
              exit 1
            fi
            "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=390,950 --force-device-scale-factor=1 --virtual-time-budget=11000 --screenshot="$GITHUB_WORKSPACE/phone-wechat-$view.png" "$url?view=$view"
            test -s "phone-wechat-$view.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-wechat-service-official-390px
          path: |
            phone-wechat-service.png
            phone-wechat-official.png
          if-no-files-found: ignore
          retention-days: 7
