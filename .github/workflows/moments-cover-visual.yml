name: Moments cover click-expansion screenshot audit
on:
  push:
    branches: [remove-checkphone-vrworld-lifesim]
    paths:
      - 'components/chat/MomentsCover.tsx'
      - 'components/chat/CharacterPhone.tsx'
      - 'components/chat/PullToRefresh.tsx'
      - 'tests/moments-cover-visual.*'
      - '.github/workflows/moments-cover-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check target TS diagnostics
        run: |
          pnpm exec tsc --noEmit --pretty false > /tmp/moments-tsc.txt 2>&1 || true
          grep -E '^(components/chat/(MomentsCover|CharacterPhone|PullToRefresh)\.tsx|tests/moments-cover-visual\.tsx)[(]' /tmp/moments-tsc.txt > /tmp/moments-target-errors.txt || true
          if [ -s /tmp/moments-target-errors.txt ]; then cat /tmp/moments-target-errors.txt; exit 1; fi
      - run: pnpm run build
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
      - uses: browser-actions/setup-chrome@v1
      - name: Render real click and wait for transition in Chromium Playwright
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vite --host 127.0.0.1 --port 5173 --strictPort >/tmp/moments-vite.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          url='http://127.0.0.1:5173/tests/moments-cover-visual.html?view=collapsed'
          for i in $(seq 1 60); do if curl -fsS "$url" >/dev/null; then break; fi; sleep 1; done
          python -m pip install --quiet playwright==1.57.0 Pillow==11.3.0
          chrome="$(command -v google-chrome || command -v chrome || command -v chromium)"
          CHROME_BIN="$chrome" python - <<'PY'
          import os
          from PIL import Image, ImageChops
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(executable_path=os.environ['CHROME_BIN'],headless=True,
                  args=['--no-sandbox','--disable-dev-shm-usage'])
              page=browser.new_page(viewport={'width':390,'height':840},device_scale_factor=1)
              page.goto('http://127.0.0.1:5173/tests/moments-cover-visual.html?view=collapsed')
              trigger=page.locator('[data-testid="moments-cover-background"]')
              picker=page.locator('[data-testid="moments-cover-picker"]')
              trigger.wait_for()
              page.wait_for_timeout(650)
              collapsed=page.locator('[data-moments-cover]').bounding_box()
              assert collapsed is not None and abs(collapsed['height']-256)<2,collapsed
              assert not trigger.get_attribute('aria-expanded')=='true'
              assert picker.is_disabled()
              nickname=page.locator('[data-testid="moments-cover-nickname"]')
              avatar=page.locator('[data-testid="moments-cover-avatar"]')
              nr=nickname.bounding_box()
              ar=avatar.bounding_box()
              # Physical geometry, not inferred from class names: keep at least 12px clearance.
              assert nr and ar and nr['x']+nr['width']<=ar['x']-11.5,(nr,ar)
              assert nr['x']>=15,(nr,ar)
              for edge in ('top','bottom'):
                  fade=page.locator('[data-testid="moments-cover-'+edge+'-fade"]')
                  assert float(fade.evaluate('(el)=>getComputedStyle(el).opacity'))<0.02
              page.screenshot(path='moments-cover-collapsed.png')
              # Verify that longer display names also stay clear of the avatar
              # at a narrower handset viewport, without moving the avatar.
              narrow=browser.new_page(viewport={'width':320,'height':760},device_scale_factor=1)
              narrow.goto('http://127.0.0.1:5173/tests/moments-cover-visual.html?view=collapsed&name='+__import__('urllib.parse',fromlist=['quote']).quote('宝宝狗的超长微信昵称测试版本'))
              narrow.locator('[data-testid="moments-cover-nickname"]').wait_for()
              narrow.wait_for_timeout(400)
              nr=narrow.locator('[data-testid="moments-cover-nickname"]').bounding_box()
              ar=narrow.locator('[data-testid="moments-cover-avatar"]').bounding_box()
              assert nr and ar and nr['x']>=15 and nr['x']+nr['width']<=ar['x']-11.5,(nr,ar)
              narrow.screenshot(path='moments-cover-long-name-320.png')
              narrow.close()
              trigger.click()
              page.wait_for_timeout(850)
              expanded=page.locator('[data-moments-cover]').bounding_box()
              main_height=page.locator('main').evaluate('(el)=>el.clientHeight')
              assert expanded is not None and expanded['height']>main_height*.72,(expanded,main_height)
              assert trigger.get_attribute('aria-expanded')=='true'
              assert not picker.is_disabled()
              assert page.locator('header').count()==0
              # The faded edges appear ONLY on the expanded cover.
              for edge in ('top','bottom'):
                  fade=page.locator('[data-testid="moments-cover-'+edge+'-fade"]')
                  assert fade.count()==1
                  assert float(fade.evaluate('(el)=>getComputedStyle(el).opacity'))>0.98
                  assert 'linear-gradient' in fade.evaluate('(el)=>getComputedStyle(el).backgroundImage')
              pb=picker.bounding_box()
              assert pb and pb['x']+pb['width']<=expanded['x']+expanded['width']+1
              assert pb['y']+pb['height']<=expanded['y']+expanded['height']+1
              page.screenshot(path='moments-cover-expanded.png')
              with page.expect_file_chooser() as picker_event:
                  picker.click()
              assert picker_event.value is not None
              print('CLICK COVER METRICS: collapsed=',collapsed,'expanded=',expanded,'mainHeight=',main_height,
                    'picker=',pb,'fileChooser=opened')
              browser.close()
          a=Image.open('moments-cover-collapsed.png').convert('RGB')
          b=Image.open('moments-cover-expanded.png').convert('RGB')
          # The cover fixture intentionally repeats harsh black/white bars.
          # Expanded top and bottom must visibly soften that contrast,
          # while the center remains substantially clearer.
          from PIL import ImageStat
          gray=b.convert('L')
          def contrast(y1,y2):
              return ImageStat.Stat(gray.crop((115,y1,275,y2))).stddev[0]
          top=contrast(39,120)
          middle=contrast(285,365)
          bottom=contrast(560,635)
          assert top < middle*.73,(top,middle,bottom)
          assert bottom < middle*.73,(top,middle,bottom)
          print('FADE VISUAL CONTRAST: top=',round(top,2),'center=',round(middle,2),
                'bottom=',round(bottom,2))
          assert ImageChops.difference(a,b).getbbox() is not None
          print('PASS: real React screenshots before/after click differ and picker opens')
          PY
      - name: Screenshot WeChat-style refresh aperture after actual pull gesture
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vite --host 127.0.0.1 --port 5173 --strictPort >/tmp/moments-refresh-vite.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          url='http://127.0.0.1:5173/tests/moments-refresh-visual.html'
          for i in $(seq 1 60); do if curl -fsS "$url" >/dev/null; then break; fi; sleep 1; done
          chrome="$(command -v google-chrome || command -v chrome || command -v chromium)"
          CHROME_BIN="$chrome" python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(executable_path=os.environ['CHROME_BIN'],headless=True,
                  args=['--no-sandbox','--disable-dev-shm-usage'])
              page=browser.new_page(viewport={'width':390,'height':850},device_scale_factor=1)
              page.goto('http://127.0.0.1:5173/tests/moments-refresh-visual.html')
              aperture=page.locator('[data-testid="moments-refresh-aperture"]')
              aperture.wait_for()
              wheel=aperture.bounding_box()
              assert wheel and abs(wheel['width']-46)<1,(wheel)
              assert aperture.locator('path').count()==8
              colors=aperture.locator('path').evaluate_all('(els)=>els.map(el=>el.getAttribute("fill"))')
              assert len(set(colors))==8,colors
              # Dispatch the same touchstart/touchmove path used by the actual
              # PullToRefresh React component, holding a long pull for screenshot.
              page.locator('main .touch-pan-y').evaluate("""(el)=>{
                 const fire=(type,y)=>{
                    const e=new Event(type,{bubbles:true,cancelable:true});
                    Object.defineProperty(e,'touches',{value:[{clientY:y}]});
                    el.dispatchEvent(e);
                 };
                 fire('touchstart',100);
                 fire('touchmove',375);
              }""")
              page.wait_for_timeout(280)
              layer=aperture.bounding_box()
              assert layer and layer['y']>80 and layer['y']<170,layer
              assert aperture.is_visible()
              page.screenshot(path='moments-cover-refresh-wheel-390.png')
              print('PASS refresh icon: visible 46px / 8 colored aperture blades / touch-pull screenshot',layer)
              browser.close()
          PY
      - name: Export compact visual snapshots into audit logs
        run: |
          python -m pip install --quiet Pillow==11.3.0
          python - <<'PY'
          from PIL import Image
          import base64,io
          for view in ('collapsed','expanded'):
              img=Image.open('moments-cover-'+view+'.png').convert('RGB')
              img.thumbnail((350,760))
              out=io.BytesIO()
              img.save(out,format='JPEG',quality=65,optimize=True)
              print('MOMENTS_IMAGE_'+view.upper()+'_START')
              print(base64.b64encode(out.getvalue()).decode())
              print('MOMENTS_IMAGE_'+view.upper()+'_END')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moments-cover-390px-real-react-screenshots
          path: moments-cover-*.png
          if-no-files-found: ignore
          retention-days: 7
