name: Story regex imported HTML safety and prompt QA
on:
  push:
    branches: [remove-checkphone-vrworld-lifesim]
    paths:
      - '.github/workflows/story-regex-integration.yml'
      - 'utils/storyRegex*.ts'
      - 'utils/storyTheaterHtml.ts'
      - 'utils/storyTheaterHtml.test.ts'
      - 'components/date/story/StoryTheaterSession.tsx'
      - 'components/date/story/StoryPresetMaker.tsx'
      - 'components/date/story/StoryRegexPanel.tsx'
      - 'components/date/story/StoryTheater.tsx'
      - 'utils/alchemy*.ts'
      - 'hooks/useAlchemyRegex.ts'
      - 'components/alchemy/*.tsx'
      - 'tests/alchemy-visual.tsx'
      - 'alchemy-visual.html'
      - 'alchemy-manager-visual.html'
      - 'tests/alchemy-manager-visual.tsx'
      - 'alchemy-live-render-visual.html'
      - 'tests/alchemy-live-render-visual.tsx'
      - 'tests/alchemy-live-browser.py'
      - 'components/chat/MessageItem.tsx'
      - 'components/chat/ChatInputArea.tsx'
      - 'apps/Chat.tsx'
      - 'apps/GroupChat.tsx'
      - 'apps/DateApp.tsx'
      - 'components/date/DateSession.tsx'
      - 'hooks/useChatAI.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regex:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test imported regex instructions, safe HTML templates and source separation
        run: pnpm exec vitest run utils/storyRegex.test.ts utils/storyRegexImport.test.ts utils/storyTheaterHtml.test.ts utils/alchemyRegex.test.ts utils/alchemyHtml.test.ts utils/alchemyIntegration.wiring.test.ts utils/alchemyRequestHistory.test.ts
      - name: Review TypeScript diagnostics in regex implementation and story viewer
        shell: bash
        run: |
          pnpm exec tsc --noEmit --pretty false > /tmp/story-regex-tsc.log 2>&1 || true
          grep -E '^(utils/(storyRegex[^/]*|storyTheaterHtml(\.test)?|alchemy[^/]*)\.ts|hooks/(useAlchemyRegex|useChatAI)\.ts|components/(alchemy/[^/]+|date/DateSession|date/story/(StoryTheaterSession|StoryTheater|StoryRegexPanel|StoryPresetMaker)|chat/(MessageItem|ChatInputArea))\.tsx|apps/(Chat|GroupChat|DateApp)\.tsx)\(' /tmp/story-regex-tsc.log > /tmp/story-regex-target-errors.log || true
          if [ -s /tmp/story-regex-target-errors.log ]; then
            cat /tmp/story-regex-target-errors.log
            exit 1
          fi
          echo 'No TypeScript errors in the story regex / viewer files'
      - name: Verify browser bundle compiles
        run: pnpm exec vite build
      - name: Install Chinese fonts for readable mobile screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-list :lang=zh family | head -n 5
      - name: Verify online and offline grouped rule lists in Chromium; take real component screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alchemy-shots
          pnpm exec vite --host 127.0.0.1 --port 5187 --strictPort > /tmp/alchemy-visual-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5187/alchemy-visual.html >/dev/null; then ready=true; break; fi
            sleep 0.3
          done
          if [ "$ready" != true ]; then cat /tmp/alchemy-visual-vite.log; exit 1; fi
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          for view in online-beauty online-rules offline-rules; do
            domain="${view%%-*}"
            section="${view#*-}"
            url="http://127.0.0.1:5187/alchemy-visual.html?domain=$domain&section=$section"
            "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --window-size=390,1150 --virtual-time-budget=4500 --dump-dom "$url" \
              > "/tmp/alchemy-shots/$view.html"
            grep -q 'data-alchemy-screenshot-ready="true"' "/tmp/alchemy-shots/$view.html" || {
              echo "Failed real rule-folder component UI: $view"
              grep -o 'alchemy-report[^>]*>[^<]*' "/tmp/alchemy-shots/$view.html" || true
              tail -n 40 /tmp/alchemy-visual-vite.log
              exit 1
            }
            "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --window-size=390,1150 --virtual-time-budget=4500 \
              --screenshot="/tmp/alchemy-shots/$view.png" "$url"
            "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --window-size=390,1150 --virtual-time-budget=4500 \
              --screenshot="/tmp/alchemy-shots/$view-expanded.png" "$url&expanded=1"
            if [ "$section" = "rules" ]; then
              for scope in online offline both; do
                "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
                  --window-size=390,1150 --virtual-time-budget=4500 --dump-dom "$url&action=scope-$scope" \
                  > "/tmp/alchemy-shots/$view-scope-$scope.html"
                grep -q 'data-alchemy-scope-ready="true"' "/tmp/alchemy-shots/$view-scope-$scope.html" || {
                  echo "Failed real collapsed-header group scope switch: $view $scope"
                  grep -o 'alchemy-scope-report[^>]*>[^<]*' "/tmp/alchemy-shots/$view-scope-$scope.html" || true
                  exit 1
                }
              done
            fi
            for action in rule-delete folder-delete; do
              "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
                --window-size=390,1150 --virtual-time-budget=4500 --dump-dom "$url&action=$action" \
                > "/tmp/alchemy-shots/$view-$action.html"
              grep -q 'data-alchemy-delete-ready="true"' "/tmp/alchemy-shots/$view-$action.html" || {
                echo "Failed confirmed deletion UI: $view $action"
                grep -o 'alchemy-delete-report[^>]*>[^<]*' "/tmp/alchemy-shots/$view-$action.html" || true
                exit 1
              }
            done
          done
      - name: Check real regex manager UI, visible HTML source and import on mobile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alchemy-manager-shots
          pnpm exec vite --host 127.0.0.1 --port 5188 --strictPort > /tmp/alchemy-manager-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:5188/alchemy-manager-visual.html >/dev/null && break || true
            sleep 0.3
          done
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          for scenario in beauty-list rules-list beauty-edit rules-edit import-raw-html import-json-html; do
            url="http://127.0.0.1:5188/alchemy-manager-visual.html?view=$scenario"
            "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --window-size=390,900 --virtual-time-budget=5500 --dump-dom "$url" \
              > "/tmp/alchemy-manager-shots/$scenario.html"
            if ! grep -q 'data-alchemy-manager-ready="true"' "/tmp/alchemy-manager-shots/$scenario.html"; then
              echo "Failed real editor interaction: $scenario"
              grep -o 'data-alchemy-manager-error="[^"]*"' "/tmp/alchemy-manager-shots/$scenario.html" || true
              tail -n 30 /tmp/alchemy-manager-vite.log
              exit 1
            fi
            "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --window-size=390,900 --virtual-time-budget=5500 \
              --screenshot="/tmp/alchemy-manager-shots/$scenario.png" "$url"
          done
      - name: Interact with live sandboxed HTML cards in real Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alchemy-live-card-shots
          pnpm exec vite --host 127.0.0.1 --port 5189 --strictPort >/tmp/alchemy-live-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5189/alchemy-live-render-visual.html >/dev/null; then ready=true; break; fi
            sleep 0.3
          done
          if [ "$ready" != true ]; then cat /tmp/alchemy-live-vite.log; exit 1; fi
          python3 -m pip install --quiet playwright
          python3 tests/alchemy-live-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alchemy-live-chat-card-screenshot
          path: /tmp/alchemy-live-card-shots/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alchemy-real-manager-mobile-screenshots
          path: /tmp/alchemy-manager-shots/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alchemy-classified-rule-mobile-screenshots
          path: /tmp/alchemy-shots/*.png
          if-no-files-found: ignore
