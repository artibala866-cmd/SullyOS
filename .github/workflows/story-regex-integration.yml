name: Story regex imported HTML safety and prompt QA
on:
  push:
    branches: [remove-checkphone-vrworld-lifesim]
    paths:
      - '.github/workflows/story-regex-integration.yml'
      - 'utils/storyRegex*.ts'
      - 'utils/storyTheaterHtml.ts'
      - 'utils/storyTheaterHtml.test.ts'
      - 'components/date/story/StoryTheaterSession.tsx'
      - 'components/date/story/StoryPresetMaker.tsx'
      - 'components/date/story/StoryRegexPanel.tsx'
      - 'components/date/story/StoryTheater.tsx'
      - 'utils/alchemy*.ts'
      - 'hooks/useAlchemyRegex.ts'
      - 'components/alchemy/*.tsx'
      - 'tests/alchemy-visual.tsx'
      - 'alchemy-visual.html'
      - 'components/chat/MessageItem.tsx'
      - 'components/chat/ChatInputArea.tsx'
      - 'apps/Chat.tsx'
      - 'apps/GroupChat.tsx'
      - 'apps/DateApp.tsx'
      - 'components/date/DateSession.tsx'
      - 'hooks/useChatAI.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regex:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test imported regex instructions, safe HTML templates and source separation
        run: pnpm exec vitest run utils/storyRegex.test.ts utils/storyRegexImport.test.ts utils/storyTheaterHtml.test.ts utils/alchemyRegex.test.ts utils/alchemyIntegration.wiring.test.ts
      - name: Review TypeScript diagnostics in regex implementation and story viewer
        shell: bash
        run: |
          pnpm exec tsc --noEmit --pretty false > /tmp/story-regex-tsc.log 2>&1 || true
          grep -E '^(utils/(storyRegex[^/]*|storyTheaterHtml(\.test)?|alchemy[^/]*)\.ts|hooks/(useAlchemyRegex|useChatAI)\.ts|components/(alchemy/[^/]+|date/DateSession|date/story/(StoryTheaterSession|StoryTheater|StoryRegexPanel|StoryPresetMaker)|chat/(MessageItem|ChatInputArea))\.tsx|apps/(Chat|GroupChat|DateApp)\.tsx)\(' /tmp/story-regex-tsc.log > /tmp/story-regex-target-errors.log || true
          if [ -s /tmp/story-regex-target-errors.log ]; then
            cat /tmp/story-regex-target-errors.log
            exit 1
          fi
          echo 'No TypeScript errors in the story regex / viewer files'
      - name: Verify browser bundle compiles
        run: pnpm exec vite build
      - name: Verify online and offline grouped rule lists in Chromium; take real component screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alchemy-shots
          pnpm exec vite --host 127.0.0.1 --port 5187 --strictPort > /tmp/alchemy-visual-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5187/alchemy-visual.html >/dev/null; then ready=true; break; fi
            sleep 0.3
          done
          if [ "$ready" != true ]; then cat /tmp/alchemy-visual-vite.log; exit 1; fi
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          for domain in online offline; do
            url="http://127.0.0.1:5187/alchemy-visual.html?domain=$domain"
            "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --window-size=390,880 --virtual-time-budget=4500 --dump-dom "$url" \
              > "/tmp/alchemy-shots/$domain.html"
            grep -q 'data-alchemy-screenshot-ready="true"' "/tmp/alchemy-shots/$domain.html" || {
              echo "Failed real rule-folder component UI: $domain"
              grep -o 'alchemy-report[^>]*>[^<]*' "/tmp/alchemy-shots/$domain.html" || true
              tail -n 40 /tmp/alchemy-visual-vite.log
              exit 1
            }
            "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --window-size=390,880 --virtual-time-budget=4500 \
              --screenshot="/tmp/alchemy-shots/$domain.png" "$url"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alchemy-classified-rule-mobile-screenshots
          path: /tmp/alchemy-shots/*.png
          if-no-files-found: ignore
