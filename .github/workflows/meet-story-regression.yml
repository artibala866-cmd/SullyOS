name: Meet story save, archive and timeline regression
on:
  push:
    branches: [remove-checkphone-vrworld-lifesim]
    paths:
      - '.github/workflows/meet-story-regression.yml'
      - 'components/date/story/**'
      - 'tests/story-reading-scroll-visual.tsx'
      - 'utils/storyReadingScroll.wiring.test.ts'
      - 'test/fixtures/story-editor-dark.html'
      - 'tests/story-editor-dark-visual.tsx'
      - 'scripts/story-lore-device-viewport.mjs'
      - 'apps/DateApp.tsx'
      - 'context/MusicContext.tsx'
      - 'utils/dateBgm*.ts'
      - 'components/date/DateSettings.tsx'
      - 'tests/date-settings-visual.tsx'
      - 'test/fixtures/date-settings-visual.html'
      - 'components/date/DateSession.tsx'
      - 'components/date/date-session-landscape.css'
      - 'tests/date-session-landscape-visual.tsx'
      - 'test/fixtures/date-session-landscape-visual.html'
      - 'utils/dateSessionLandscape.test.ts'
      - 'utils/dateScenes*.ts'
      - 'utils/datePrompts*.ts'
      - 'utils/dateBackgroundBlobRef.test.ts'
      - 'utils/dateSceneSession.test.tsx'
      - 'utils/storyTheater*.ts'
      - 'utils/storyTheater*.tsx'
      - 'utils/tavernOpeningGreeting.ts'
      - 'utils/tavernOpeningGreeting.test.ts'
      - 'utils/linkStoryOpenings.ts'
      - 'utils/storySillyTavernImport*.ts'
      - 'utils/storyTavernAuthorSections.test.ts'
      - 'utils/storyQuickPresetPanel.test.tsx'
      - 'tests/story-quick-author-visual.tsx'
      - 'test/fixtures/story-quick-author-visual.html'
      - 'utils/storyPresetImport*.ts'
      - 'utils/storyPresetImport*.tsx'
      - 'tests/story-preset-import-audit-visual.tsx'
      - 'test/fixtures/story-preset-import-audit.html'
      - 'test/fixtures/story-tavern-html-visual.html'
      - 'tests/story-tavern-html-visual.tsx'
      - 'utils/meetingAppearance.ts'
      - 'utils/meetingAppearance.test.ts'
      - 'utils/beautyShareContract.ts'
      - 'utils/decorationWorkshop.ts'
      - 'utils/db.ts'
      - 'types.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sully-meet-story-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test story creation, persistence, archives, backups and timeline compatibility
        run: |
          pnpm exec vitest run utils/tavernOpeningGreeting.test.ts utils/storyTheaterHtml.test.ts utils/storyTheaterHtmlUI.test.tsx utils/storyTheaterRealDialectAudit.test.ts utils/storyTavernCategories.test.ts utils/storySillyTavernImport.test.ts utils/storyTavernAuthorSections.test.ts utils/storyQuickPresetPanel.test.tsx utils/storyPresetImportAudit.test.ts utils/storyPresetImportUi.test.tsx utils/storyTheater.test.ts utils/storyTheaterPersistence.test.ts utils/db.storyTheater.test.ts utils/storyTheaterArchive.test.ts utils/storyTheaterMemoryConversion.test.ts utils/storyTheaterTimeline.test.ts utils/storyTheaterBackup.test.ts utils/storyTheaterDeletion.test.ts utils/storyTheaterArchiveView.wiring.test.ts utils/storyTheaterBillingSafety.wiring.test.ts utils/meetingAppearance.test.ts utils/dateScenes.test.ts utils/dateBgm.test.ts utils/dateBgm.wiring.test.ts utils/dateSceneSession.test.tsx utils/dateSessionLandscape.test.ts utils/datePrompts.test.ts utils/dateBackgroundBlobRef.test.ts utils/dateSpriteBlobRef.test.ts utils/storyTheaterUpstreamIntegration.test.tsx utils/storyTheaterDarkEditor.test.ts utils/storyReadingScroll.wiring.test.ts utils/storyTheaterAtomicTurn.test.ts utils/storyTheaterArchiveAtomic.test.ts utils/storyTheaterReply.test.ts utils/storyTheaterEntryFlow.test.ts utils/storyTheaterLegacyDbUpgrade.test.ts utils/storyTheaterSaveNavigate.test.ts utils/storyTheaterOpeningInline.test.tsx
      - name: Check meet and database TypeScript diagnostics
        shell: bash
        run: |
          pnpm exec tsc --noEmit --pretty false > /tmp/meet-story-tsc.log 2>&1 || true
          grep -E '^(types.ts|tests/story-editor-dark-visual.tsx|apps/DateApp.tsx|utils/db.ts|utils/storyTheater[^/]*\.tsx?|utils/storySillyTavernImport(\.test)?\.ts|utils/summaryReasoning.ts|utils/meetingAppearance(\.test)?\.ts|utils/dateScenes(\\.test)?\\.ts|utils/dateSceneSession\\.test\\.tsx|utils/dateBackgroundBlobRef\\.test\\.ts|utils/datePrompts(\\.test)?\\.ts|components/date/(DateSession|DateSettings)\\.tsx|utils/beautyShareContract.ts|utils/decorationWorkshop.ts|components/date/story/[^/]+\.tsx?)[(]' /tmp/meet-story-tsc.log > /tmp/meet-story-errors.log || true
          if [ -s /tmp/meet-story-errors.log ]; then
            cat /tmp/meet-story-errors.log
            exit 1
          fi
          echo "Meet story TypeScript diagnostics clean."
      - name: Verify production Vite bundle
        run: pnpm run build

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Render the real story editor in headless Chromium at mobile viewport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/meet-story
          pnpm exec vite --host 127.0.0.1 --port 5193 --strictPort > output/meet-story/vite.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsSL http://127.0.0.1:5193/test/fixtures/story-editor-dark.html >/dev/null; then break; fi
            sleep 1
          done
          # Runner images can lack Chinese fonts; install for meaningful screenshot inspection.
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-microhei
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser" || { echo 'No Chromium executable on runner'; exit 1; }
          url='http://127.0.0.1:5193/test/fixtures/story-editor-dark.html'
          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage             --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=8000             --dump-dom "$url" > output/meet-story/rendered-dom.html 2> output/meet-story/chrome.log
          grep -q 'data-story-gray-ready="true"' output/meet-story/rendered-dom.html || {
            grep -E 'story-gray-browser-report|storyGrayReady|error' output/meet-story/rendered-dom.html | tail -c 5000 || true
            cat output/meet-story/chrome.log | tail -45
            exit 1
          }
          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage             --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=8000             --screenshot=output/meet-story/story-editor-dark-390.png "$url"             > output/meet-story/screenshot.log 2>&1
          test -s output/meet-story/story-editor-dark-390.png
          # Chinese text must be legible in screenshots rather than tofu squares.
          # The virtual machine may not provide a CJK font by default.
          # Color assertions above already use the live DOM and do not depend on this install.
          for focus in memory bottom; do
            "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage               --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=8000               --dump-dom "${url}?focus=${focus}" > "output/meet-story/${focus}-dom.html"               2> "output/meet-story/${focus}-chrome.log"
            grep -q 'data-story-gray-ready="true"' "output/meet-story/${focus}-dom.html"
            "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage               --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=8000               --screenshot="output/meet-story/story-editor-${focus}-390.png" "${url}?focus=${focus}"               > "output/meet-story/${focus}-screenshot.log" 2>&1
            test -s "output/meet-story/story-editor-${focus}-390.png"
          done
          for scenario in selected editing legacy styledTavern auto manual empty unselected customReady customSaved customMulti customRecovered autoNameTavern autoNameLink autoNameManual; do
            lighturl="${url}?mode=light&scenario=${scenario}&focus=opening"
            "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=8000 \
              --dump-dom "$lighturl" > "output/meet-story/light-${scenario}-dom.html" \
              2> "output/meet-story/light-${scenario}-chrome.log"
            grep -q 'data-story-gray-ready="true"' "output/meet-story/light-${scenario}-dom.html"
            "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=8000 \
              --screenshot="output/meet-story/story-editor-light-${scenario}-390.png" "$lighturl" \
              > "output/meet-story/light-${scenario}-screenshot.log" 2>&1
            test -s "output/meet-story/story-editor-light-${scenario}-390.png"
          done
          # Verify the *CSS* viewport, not Chrome's >=500px minimum desktop
          # layout accidentally cropped into an apparent 320px screenshot.
          for width in 390 320; do
            loreurl="http://127.0.0.1:5193/test/fixtures/story-editor-dark.html?mode=light&scenario=globalLore&focus=lore"
            CHROME_BIN="$browser" node scripts/story-lore-device-viewport.mjs \
              "$loreurl" "$width" 844 \
              "output/meet-story/story-global-lore-${width}.png" \
              "output/meet-story/global-lore-${width}-device.json"
            test -s "output/meet-story/story-global-lore-${width}.png"
            grep -q "\"width\": $width" "output/meet-story/global-lore-${width}-device.json"
          done
          # Regression: imported Tavern preset uses the original preset section, not an extra panel.
          tavernurl="${url}?scenario=tavern&focus=preset"
          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=8000 \
            --dump-dom "$tavernurl" > output/meet-story/tavern-import-dom.html \
            2> output/meet-story/tavern-import-chrome.log
          grep -q 'data-story-gray-ready="true"' output/meet-story/tavern-import-dom.html
          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=8000 \
            --screenshot=output/meet-story/story-editor-tavern-import-390.png "$tavernurl" \
            > output/meet-story/tavern-import-screenshot.log 2>&1
          test -s output/meet-story/story-editor-tavern-import-390.png
          # Real React preset maker: imported 373-entry preset must open the
          # professional list, allow its imported placeholder toggle, fit mobile,
          # and leave the original native maker in the default simple view.
          for variant in imported native; do
            for focus in overview slot deep; do
              if [ "$variant" = native ] && [ "$focus" = slot ]; then continue; fi
              auditurl="http://127.0.0.1:5193/test/fixtures/story-preset-import-audit.html?variant=${variant}&focus=${focus}"
              prefix="output/meet-story/preset-audit-${variant}-${focus}"
              "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
                --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=10000 \
                --dump-dom "$auditurl" > "${prefix}.html" 2> "${prefix}.log"
              grep -q 'data-story-preset-audit-ready="true"' "${prefix}.html" || {
                grep -o 'id="story-preset-audit-report"[^<]*' "${prefix}.html" | tail -c 1200 || true
                tail -n 30 "${prefix}.log"
                exit 1
              }
              "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
                --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=10000 \
                --screenshot="${prefix}.png" "$auditurl" > /dev/null 2>&1
              test -s "${prefix}.png"
            done
          done
          # Video reference: render the ACTUAL native preset maker with each
          # imported dialect, verifying auto-detected controls, token values,
          # native labels, and no horizontal overflow on a phone.
          for dialect in baby pluto ako mur janus gomora ivory yuki phantasm unseen; do
            auditurl="http://127.0.0.1:5193/test/fixtures/story-preset-import-audit.html?dialect=${dialect}&theme=light"
            prefix="output/meet-story/native-map-${dialect}-390"
            "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=10000 \
              --dump-dom "$auditurl" > "${prefix}.html" 2> "${prefix}.log"
            grep -q 'data-story-preset-audit-ready="true"' "${prefix}.html" || {
              grep -o 'id="story-preset-audit-report"[^<]*' "${prefix}.html" | tail -c 2000 || true
              tail -n 40 "${prefix}.log"
              exit 1
            }
            "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=10000 \
              --screenshot="${prefix}.png" "$auditurl" > /dev/null 2>&1
            test -s "${prefix}.png"
          done
          # Source-choice interaction must change the actual authored option,
          # not add a copied native instruction. Screenshot AFTER clicking.
          authorurl="http://127.0.0.1:5193/test/fixtures/story-preset-import-audit.html?dialect=baby&focus=author&theme=light"
          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=10000 \
            --dump-dom "$authorurl" > output/meet-story/baby-author-toggle.html 2> output/meet-story/baby-author-toggle.log
          grep -q 'data-story-preset-audit-ready="true"' output/meet-story/baby-author-toggle.html || {
            grep -o 'id="story-preset-audit-report"[^<]*' output/meet-story/baby-author-toggle.html | tail -c 2000 || true
            exit 1
          }
          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=10000 \
            --screenshot=output/meet-story/native-map-baby-toggled-390.png "$authorurl" > /dev/null 2>&1
          test -s output/meet-story/native-map-baby-toggled-390.png
          echo 'PASS: nine distinct source-author modules plus real Baby Char toggle screenshot checked'
          # Same real React quick-preset sheet as the story session: show
          # imported Baby author style, an unfamiliar author, the native preset
          # and an already-selected per-story author style.
          for scenario in baby unseen native baby-selected; do
            case "$scenario" in
              baby-selected) quickArgs='variant=baby&selected=1' ;;
              *) quickArgs="variant=$scenario" ;;
            esac
            quickUrl="http://127.0.0.1:5193/test/fixtures/story-quick-author-visual.html?$quickArgs"
            quickPrefix="output/meet-story/story-quick-$scenario-390"
            "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=9000 \
              --dump-dom "$quickUrl" > "$quickPrefix.html" 2> "$quickPrefix.log"
            grep -q 'data-story-quick-author-ready="true"' "$quickPrefix.html" || {
              grep -o 'id="story-quick-author-report"[^<]*' "$quickPrefix.html" | tail -c 2200 || true
              tail -n 40 "$quickPrefix.log"
              exit 1
            }
            "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=9000 \
              --screenshot="$quickPrefix.png" "$quickUrl" > /dev/null 2>&1
            test -s "$quickPrefix.png"
          done
          echo 'PASS: in-story quick preset displays source-author choices, unknown presets and native options'
          # Screenshot the exact safe HTML viewer used by the real story output.
          for viewport in 390x844 844x390; do
            width="${viewport%x*}"; height="${viewport#*x}"
            htmlurl="http://127.0.0.1:5193/test/fixtures/story-tavern-html-visual.html"
            prefix="output/meet-story/tavern-html-${viewport}"
            "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --window-size="${width},${height}" --force-device-scale-factor=1 --virtual-time-budget=7000 \
              --dump-dom "$htmlurl" > "${prefix}.html" 2> "${prefix}.log"
            grep -q 'data-story-theater-html-ready="true"' "${prefix}.html" || {
              grep -o 'id="story-tavern-html-report"[^<]*' "${prefix}.html" | tail -c 1800 || true
              tail -n 30 "${prefix}.log"
              exit 1
            }
            "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --window-size="${width},${height}" --force-device-scale-factor=1 --virtual-time-budget=7000 \
              --screenshot="${prefix}.png" "$htmlurl" > /dev/null 2>&1
            test -s "${prefix}.png"
          done
          # Real protocol dialects derived from the four supplied Tavern
          # exports: photo-free HTML styling, multiple side appendices and
          # the non-theater case. Screenshot each portrait and landscape.
          for dialect in pluto ako mur janus; do
            for viewport in 390x844 844x390; do
              width="${viewport%x*}"; height="${viewport#*x}"
              htmlurl="http://127.0.0.1:5193/test/fixtures/story-tavern-html-visual.html?dialect=${dialect}"
              prefix="output/meet-story/tavern-${dialect}-${viewport}"
              "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
                --window-size="${width},${height}" --force-device-scale-factor=1 --virtual-time-budget=7000 \
                --dump-dom "$htmlurl" > "${prefix}.html" 2> "${prefix}.log"
              grep -q 'data-story-theater-html-ready="true"' "${prefix}.html" || {
                grep -o 'id="story-tavern-html-report"[^<]*' "${prefix}.html" | tail -c 1800 || true
                tail -n 30 "${prefix}.log"
                exit 1
              }
              "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
                --window-size="${width},${height}" --force-device-scale-factor=1 --virtual-time-budget=7000 \
                --screenshot="${prefix}.png" "$htmlurl" > /dev/null 2>&1
              test -s "${prefix}.png"
            done
          done
          echo 'PASS: 4 supplied Tavern dialects screenshot verified in portrait and landscape'
          echo 'PASS: real Tavern nested HTML theater, CSP-locked iframe, no scripts, portrait and landscape'
          echo 'PASS: real imported and native preset maker screenshots, 373-entry fit, enabled source marker toggle'
          echo 'PASS: dark and light story editor, mobile viewport, manual/auto/prewritten opening, no duplicate cast options'
      - name: Screenshot and inspect actual Meet scene settings at mobile width
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/meet-scenes
          pnpm exec vite --host 127.0.0.1 --port 5194 --strictPort > output/meet-scenes/vite.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsSL http://127.0.0.1:5194/test/fixtures/date-settings-visual.html >/dev/null; then break; fi
            sleep 1
          done
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          for scenario in filled empty clear upload top; do
            url="http://127.0.0.1:5194/test/fixtures/date-settings-visual.html?scenario=${scenario}"
            "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=24000 --dump-dom "$url" > "output/meet-scenes/${scenario}.html" 2> "output/meet-scenes/${scenario}-browser.log"
            grep -q 'data-date-settings-ready="true"' "output/meet-scenes/${scenario}.html" || {
              grep 'date-settings-browser-report' "output/meet-scenes/${scenario}.html" | tail -c 2500 || true
              tail -n 35 "output/meet-scenes/${scenario}-browser.log"
              exit 1
            }
            "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=24000 --screenshot="output/meet-scenes/${scenario}-390.png" "$url" > /dev/null 2>&1
            test -s "output/meet-scenes/${scenario}-390.png"
            grep 'date-settings-browser-report' "output/meet-scenes/${scenario}.html" | sed 's/<[^>]*>//g' | cut -c 1-1000 || true
          done
          for scenario in filled empty clear upload top; do
            echo "MEET_SCENE_SCREENSHOT_${scenario}_BASE64_BEGIN"
            base64 -w0 "output/meet-scenes/${scenario}-390.png"
            echo
            echo "MEET_SCENE_SCREENSHOT_${scenario}_BASE64_END"
          done
          echo 'PASS: five real Meet settings browser screenshots (filled, empty, clear, two real uploads, top) with six scene slots'
      - name: Screenshot real Meet conversation in phone landscape, input, menu and portrait
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/meet-landscape
          pnpm exec vite --host 127.0.0.1 --port 5195 --strictPort > output/meet-landscape/vite.log 2>&1 &
          for i in $(seq 1 80); do
            if curl -fsSL http://127.0.0.1:5195/test/fixtures/date-session-landscape-visual.html > /dev/null; then break; fi
            sleep 1
          done
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          for scenario in dialogue input menu reading zoom landscapeKeyboard landscapeKeyboardZoom landscapeKeyboardRestore landscapeKeyboardMenu; do
            for viewport in 844x390 740x360; do
              width="${viewport%x*}"; height="${viewport#*x}"
              url="http://127.0.0.1:5195/test/fixtures/date-session-landscape-visual.html?scenario=${scenario}"
              prefix="output/meet-landscape/${scenario}-${viewport}"
              "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
                --window-size="${width},${height}" --force-device-scale-factor=1 \
                --virtual-time-budget=8000 --dump-dom "$url" > "${prefix}.html" 2> "${prefix}.log"
              if ! grep -q 'data-meet-landscape-ready="true"' "${prefix}.html"; then
                grep -o 'id="meet-landscape-report"[^<]*' "${prefix}.html" | tail -c 2500 || true
                tail -n 35 "${prefix}.log"
                exit 1
              fi
              "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
                --window-size="${width},${height}" --force-device-scale-factor=1 \
                --virtual-time-budget=8000 --screenshot="${prefix}.png" "$url" >/dev/null 2>&1
              test -s "${prefix}.png"
              grep -o 'id="meet-landscape-report"[^<]*' "${prefix}.html" | tail -c 1300 || true
            done
          done
          for scenario in input keyboard zoom; do
            url="http://127.0.0.1:5195/test/fixtures/date-session-landscape-visual.html?scenario=${scenario}"
            prefix="output/meet-landscape/portrait-${scenario}"
            "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=8000 \
              --dump-dom "$url" > "${prefix}.html" 2> "${prefix}.log"
            if ! grep -q 'data-meet-landscape-ready="true"' "${prefix}.html"; then
              grep -o 'id="meet-landscape-report"[^<]*' "${prefix}.html" | tail -c 2500 || true
              exit 1
            fi
            "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=8000 \
              --screenshot="${prefix}.png" "$url" >/dev/null 2>&1
          done
          # A portrait handset can have a landscape-shaped CSS viewport after
          # the keyboard opens; it must still use the narrow-phone layout.
          url="http://127.0.0.1:5195/test/fixtures/date-session-landscape-visual.html?scenario=keyboard"
          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=390,360 --force-device-scale-factor=1 --virtual-time-budget=8000 \
            --dump-dom "$url" > output/meet-landscape/portrait-short-keyboard.html 2> output/meet-landscape/portrait-short-keyboard.log
          grep -q 'data-meet-landscape-ready="true"' output/meet-landscape/portrait-short-keyboard.html
          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=390,360 --force-device-scale-factor=1 --virtual-time-budget=8000 \
            --screenshot=output/meet-landscape/portrait-short-keyboard.png "$url" >/dev/null 2>&1
          for frame in dialogue-844x390 input-844x390 menu-740x360 input-740x360 zoom-740x360 landscapeKeyboard-844x390 landscapeKeyboardZoom-740x360 landscapeKeyboardRestore-844x390 landscapeKeyboardMenu-740x360 portrait-input portrait-keyboard portrait-zoom portrait-short-keyboard; do
            echo "MEET_LANDSCAPE_SCREENSHOT_${frame}_BEGIN"
            base64 -w0 "output/meet-landscape/${frame}.png"
            echo
            echo "MEET_LANDSCAPE_SCREENSHOT_${frame}_END"
          done
          echo 'PASS: Meet responsive layout verified in real Chromium for small landscape and portrait'
      - name: Screenshot cinema decoration in the real story component after closing appearance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/story-cinema-after-close
          pnpm exec vite --host 127.0.0.1 --port 5197 --strictPort > output/story-cinema-after-close/vite.log 2>&1 &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 70); do
            if curl -fsS http://127.0.0.1:5197/story-reading-scroll-visual.html >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat output/story-cinema-after-close/vite.log; exit 1; fi
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          for mode in plain cinema; do
            url="http://127.0.0.1:5197/story-reading-scroll-visual.html?mode=${mode}&focus=middle"
            "$browser" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run \
              --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=7000 \
              --dump-dom "$url" > "output/story-cinema-after-close/${mode}.html" 2> "output/story-cinema-after-close/${mode}.log"
            grep -q 'data-story-scroll-ready="true"' "output/story-cinema-after-close/${mode}.html" || {
              grep 'story-scroll-report' "output/story-cinema-after-close/${mode}.html" | tail -c 1400 || true
              tail -n 30 "output/story-cinema-after-close/${mode}.log" || true
              exit 1
            }
            "$browser" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run \
              --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=7000 \
              --screenshot="output/story-cinema-after-close/${mode}-390.png" "$url" >/dev/null 2>&1
            test -s "output/story-cinema-after-close/${mode}-390.png"
          done
          echo "STORY_CINEMA_SCREENSHOT_BEGIN"
          base64 -w0 output/story-cinema-after-close/cinema-390.png
          echo
          echo "STORY_CINEMA_SCREENSHOT_END"
          echo "PASS: cinema decor visible after closing the real appearance portal; plain remains unchanged"
      - name: Attach browser screenshot and computed style report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meet-story-mobile-visual
          path: |
            output/meet-story/
            output/meet-scenes/
            output/meet-landscape/
            output/story-cinema-after-close/
          if-no-files-found: ignore
