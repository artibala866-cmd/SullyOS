name: Meet story save, archive and timeline regression
on:
  push:
    branches: [remove-checkphone-vrworld-lifesim]
    paths:
      - '.github/workflows/meet-story-regression.yml'
      - 'components/date/story/**'
      - 'utils/storyTheater*.ts'
      - 'utils/db.ts'
      - 'types.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sully-meet-story-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test story creation, persistence, archives, backups and timeline compatibility
        run: |
          pnpm exec vitest run utils/storyTheater.test.ts utils/db.storyTheater.test.ts utils/storyTheaterArchive.test.ts utils/storyTheaterMemoryConversion.test.ts utils/storyTheaterTimeline.test.ts utils/storyTheaterBackup.test.ts utils/storyTheaterDeletion.test.ts utils/storyTheaterArchiveView.wiring.test.ts utils/storyTheaterBillingSafety.wiring.test.ts
      - name: Check meet and database TypeScript diagnostics
        shell: bash
        run: |
          pnpm exec tsc --noEmit --pretty false > /tmp/meet-story-tsc.log 2>&1 || true
          grep -E '^(types.ts|utils/db.ts|utils/storyTheater[^/]*\.tsx?|utils/summaryReasoning.ts|components/date/story/[^/]+\.tsx?)[(]' /tmp/meet-story-tsc.log > /tmp/meet-story-errors.log || true
          if [ -s /tmp/meet-story-errors.log ]; then
            cat /tmp/meet-story-errors.log
            exit 1
          fi
          echo "Meet story TypeScript diagnostics clean."
      - name: Verify production Vite bundle
        run: pnpm run build
