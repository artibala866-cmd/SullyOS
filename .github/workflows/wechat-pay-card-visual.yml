name: Character phone WeChat Pay visual screenshot
on:
  push:
    branches: [remove-checkphone-vrworld-lifesim]
    paths:
      - 'components/chat/PhoneWeChatPayCards.tsx'
      - 'components/chat/PhoneWeChatPayCards.test.tsx'
      - 'components/chat/CharacterPhone.tsx'
      - 'tests/wechat-pay-card-visual.*'
      - '.github/workflows/wechat-pay-card-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phone-wechat-pay-visual
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test saved WeChat Pay notice card parsing and display
        run: pnpm exec vitest run components/chat/PhoneWeChatPayCards.test.tsx
      - name: Build real application
        run: pnpm run build
      - name: Install Chinese font and Chrome
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Screenshot real React WeChat Pay cards at mobile width
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vite --host 127.0.0.1 --port 5173 --strictPort >/tmp/pay-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          url='http://127.0.0.1:5173/tests/wechat-pay-card-visual.html'
          for i in $(seq 1 60); do if curl -fsS "$url" >/dev/null; then break; fi; sleep 1; done
          chrome="${{ steps.chrome.outputs.chrome-path }}"
          for view in top second; do
            "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --window-size=390,940 --virtual-time-budget=11000               --dump-dom "$url?view=$view" > "/tmp/pay-$view-dom.txt" 2>/tmp/pay-$view-chrome.log || true
            if ! grep -q 'data-ready="true"' "/tmp/pay-$view-dom.txt"; then
              grep -o '<output[^>]*>[^<]*</output>' "/tmp/pay-$view-dom.txt" || true
              tail -45 /tmp/pay-vite.log || true
              exit 1
            fi
            "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=390,940 --virtual-time-budget=11000               --screenshot="$GITHUB_WORKSPACE/wechat-pay-$view.png" "$url?view=$view"
            test -s "wechat-pay-$view.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wechat-pay-mobile-screenshots
          path: |
            wechat-pay-top.png
            wechat-pay-second.png
          if-no-files-found: ignore
          retention-days: 7
