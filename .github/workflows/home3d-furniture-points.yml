name: Home3D furniture interaction regression

on:
  pull_request:
    branches:
      - remove-checkphone-vrworld-lifesim
    paths:
      - 'apps/room3d/**'
      - 'public/room3d/catalog.json'
      - 'docs/room3d/**'
      - '.github/workflows/home3d-furniture-points.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  furniture-points:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify catalog, point transforms and interaction routes
        run: pnpm exec vitest run apps/room3d/furniturePointRegistry.test.js apps/room3d/furnitureCapabilityRegistry.test.js apps/room3d/mirrorJourney.test.js apps/room3d/furnitureMeshSeat.test.js apps/room3d/legacyFurnitureSource.test.js apps/room3d/furnitureSeatCompatibility.test.js apps/room3d/furnitureDiningCompatibility.test.js utils/room3dSeating.test.ts utils/room3dFurnitureInteractions.test.ts utils/room3dFurnitureCatalog.test.ts utils/room3dBedroomReference.test.ts utils/room3dMirrorJourney.test.ts utils/room3dDining.test.ts utils/room3dFurnitureDock.test.ts utils/room3dGaming.test.ts utils/room3dFunctionalLayout.test.ts
      - name: Build
        run: pnpm build
