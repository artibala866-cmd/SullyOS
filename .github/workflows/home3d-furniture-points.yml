name: Home3D furniture interaction regression

on:
  push:
    branches:
      - remove-checkphone-vrworld-lifesim
    paths:
      - 'apps/room3d/**'
      - 'utils/chibiFurnitureMotion.test.ts'
      - 'utils/chibiRoomWalk.test.ts'
      - 'utils/room3dBathroomActions.test.ts'
      - 'test/home3d-smoke.html'
      - 'test/home3d-photo-export.html'
      - 'scripts/home3d-photo-webgl-smoke.mjs'
      - 'scripts/home3d-webgl-smoke.mjs'
      - 'public/room3d/catalog.json'
      - '.github/workflows/home3d-furniture-points.yml'
  pull_request:
    branches:
      - remove-checkphone-vrworld-lifesim
    paths:
      - 'apps/room3d/**'
      - 'test/home3d-smoke.html'
      - 'test/home3d-photo-export.html'
      - 'scripts/home3d-photo-webgl-smoke.mjs'
      - 'scripts/home3d-webgl-smoke.mjs'
      - 'public/room3d/catalog.json'
      - 'docs/room3d/**'
      - 'art/jellyfish-home/**'
      - '.github/workflows/home3d-furniture-points.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  furniture-points:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify catalog, point transforms and interaction routes
        run: pnpm exec vitest run apps/room3d/furniturePointRegistry.test.js apps/room3d/furnitureCapabilityRegistry.test.js apps/room3d/mirrorJourney.test.js apps/room3d/furnitureMeshSeat.test.js apps/room3d/kitFurnitureContact.test.js apps/room3d/legacyFurnitureSource.test.js apps/room3d/furnitureSeatCompatibility.test.js apps/room3d/furnitureDiningCompatibility.test.js apps/room3d/furnitureStationRegistry.test.js apps/room3d/seatAccess.test.js apps/room3d/occupiedFurnitureChange.test.js apps/room3d/bedMotionAccess.test.js apps/room3d/bathroomJourney.test.js apps/room3d/bathroomRigMotion.test.js apps/room3d/frameBudgetTiming.test.js utils/homeRomance.test.ts utils/homeGuestLife.test.ts utils/homeVisits.test.ts apps/room3d/furnitureGeometryCoverage.test.js apps/room3d/furnitureBrowserCoverage.test.js apps/room3d/kitchenStationMenu.test.js apps/room3d/wateringReachability.test.js utils/room3dSeating.test.ts utils/room3dFurnitureInteractions.test.ts utils/room3dFurnitureCatalog.test.ts utils/room3dBedroomReference.test.ts utils/room3dMirrorJourney.test.ts utils/room3dDining.test.ts utils/room3dFurnitureDock.test.ts utils/room3dGaming.test.ts utils/room3dFunctionalLayout.test.ts
      - name: Full room3d regression suite
        run: pnpm exec vitest run utils/room3d
      - name: Verify Halloween 25 GLBs, 20 presets, pet hats and interactive prop meshes
        timeout-minutes: 14
        run: pnpm exec vitest run apps/room3d/halloweenMeshAcceptance.test.ts apps/room3d/halloweenWardrobeFestival.test.js utils/wardrobePickerUI.test.ts
      - name: Verify photo crop, landscape camera, export resolution, and original capture lifecycle
        run: pnpm exec vitest run apps/room3d/photoFrame.test.ts apps/room3d/HomePhotoMode.test.tsx apps/room3d/photoEffectsReuse.test.ts
      - name: Build
        run: pnpm build
      - name: Chromium WebGL photo 4-frame full-quality PNG acceptance
        timeout-minutes: 5
        run: |
          pnpm exec vite --host 127.0.0.1 --port 4173 --strictPort > /tmp/home3d-photo-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          node scripts/home3d-photo-webgl-smoke.mjs
      - name: Preserve real WebGL exported photo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home3d-photo-export-acceptance
          path: home3d-photo-acceptance/
          if-no-files-found: ignore
          retention-days: 7
      - name: Halloween WebGL visual review of 20 outfits and 9 pet species with both hats
        timeout-minutes: 12
        run: |
          pnpm exec vite --host 127.0.0.1 --port 4173 --strictPort > /tmp/halloween-visual-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          node scripts/halloween-visual-smoke.mjs
      - name: Preserve Halloween desktop/mobile screenshots and every rendered sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halloween-visual-acceptance
          path: halloween-visual-acceptance/
          if-no-files-found: ignore
          retention-days: 7
      - name: Chromium WebGL scene and seat-action smoke
        timeout-minutes: 5
        run: |
          pnpm exec vite --host 127.0.0.1 --port 4173 --strictPort > /tmp/home3d-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          node scripts/home3d-webgl-smoke.mjs
      - name: Preserve browser screenshot and debug result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home3d-webgl-smoke
          path: home3d-webgl-smoke/
          if-no-files-found: ignore
          retention-days: 7
