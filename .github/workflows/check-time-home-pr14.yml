name: PR14 - Check time awareness and home recovery
on:
  push:
    branches:
      - fix/time-awareness-phone-home-recovery-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Private chat time awareness tests
        run: pnpm exec vitest run utils/chatPrompts.test.ts utils/timeAwarenessRequests.test.ts utils/contextTimeAwareness.test.ts
      - name: Character phone and NPC regression tests
        run: pnpm exec vitest run utils/characterPhoneAutonomy.test.ts utils/phoneChatPiggyback.test.ts utils/relationshipChat.test.ts
      - name: Home scene and overlay layout tests
        run: pnpm exec vitest run apps/room3d/dreamEntryLayout.test.js utils/homePresenceBubbles.test.ts utils/homeChatPipelineParity.test.ts apps/room3d/renderQuality.test.js
      - name: Full app production build
        env:
          GITHUB_PAGES: '1'
        run: pnpm run build
