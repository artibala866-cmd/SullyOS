name: Neural-link 3D figure cabinet actual Chromium visual checks
on:
  push:
    branches: [remove-checkphone-vrworld-lifesim]
    paths:
      - 'components/character/ChibiStudio.tsx'
      - 'components/character/HomeFigureStudio.tsx'
      - 'components/character/HomeFigureEditor.tsx'
      - 'tests/neural-link-cabinet-visual.html'
      - 'tests/neural-link-cabinet-visual.tsx'
      - '.github/workflows/figure-studio-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: figure-cabinet-visual-${{ github.sha }}
  cancel-in-progress: false
jobs:
  actual-mobile-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 9}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with: {chrome-version: stable}
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Mount actual React cabinet components and capture phone-sized screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p figure-visual
          pnpm exec vite --host 127.0.0.1 --port 5173 --strictPort >/tmp/figure-vite.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:5173/tests/neural-link-cabinet-visual.html >/dev/null; then break; fi
            sleep 1
          done
          chrome="${{ steps.chrome.outputs.chrome-path }}"
          for name in empty-shelf saved-shelf empty-cabinet saved-cabinet saved-source; do
            case "$name" in
              empty-shelf) query='scene=shelf&existing=0';;
              saved-shelf) query='scene=shelf&existing=1';;
              empty-cabinet) query='scene=cabinet&existing=0';;
              saved-cabinet) query='scene=cabinet&existing=1';;
              saved-source) query='scene=source&existing=1';;
            esac
            url="http://127.0.0.1:5173/tests/neural-link-cabinet-visual.html?$query"
            "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=430,930 --virtual-time-budget=14000 --dump-dom "$url" >"figure-visual/$name.html" 2>/tmp/figure-chrome.log || true
            if ! grep -q 'data-figure-visual-ready="true"' "figure-visual/$name.html"; then
              echo "Actual React UI failed: $name"
              grep -o 'data-error="[^"]*"' "figure-visual/$name.html" | head -c 2000 || true
              grep -o '<output id="neural-cabinet-visual-checks"[^<]*[^<]*' "figure-visual/$name.html" | head -c 3000 || true
              tail -60 /tmp/figure-vite.log || true
              exit 1
            fi
            "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=430,930 --force-device-scale-factor=1 --virtual-time-budget=14000 --screenshot="$GITHUB_WORKSPACE/figure-visual/$name.png" "$url"
            test -s "figure-visual/$name.png"
            echo "Verified and captured real React 3D figure scene: $name"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neural-link-actual-react-mobile-screenshots
          path: figure-visual/
          if-no-files-found: ignore
          retention-days: 14
