name: Chat auto-reply intent regression

on:
  push:
    branches: [remove-checkphone-vrworld-lifesim]
    paths:
      - 'hooks/useChatAutoReply.ts'
      - 'utils/unsolicitedDeliveryGate.ts'
      - 'utils/unsolicitedDeliveryGate.test.ts'
      - 'utils/unsolicitedDeliveryGate.wiring.test.ts'
      - 'utils/amsgDisabledRepair.ts'
      - 'utils/amsgDisabledRepair.test.ts'
      - 'utils/legacyAiScheduledCleanup.ts'
      - 'utils/legacyAiScheduledCleanup.test.ts'
      - 'utils/legacyMessageRetirement.test.ts'
      - 'utils/chatPrompts.scheduleTag.test.ts'
      - 'utils/chatParser.ts'
      - 'utils/chatParser.scheduleMessage.test.ts'
      - 'utils/db.ts'
      - 'utils/amsg2CharToggle.wiring.test.ts'
      - 'utils/activeMsgRuntime.ts'
      - 'context/OSContext.tsx'
      - 'components/chat/ActiveMsg2SettingsModal.tsx'
      - 'hooks/useChatAI.ts'
      - 'utils/amsgInstantChat.ts'
      - 'utils/amsgInstantChat.test.ts'
      - 'utils/chatContinuation.ts'
      - 'utils/realPersonReplyTurn.ts'
      - 'utils/realPersonReplyTurn.test.ts'
      - 'utils/chatPrompts.ts'
      - 'utils/chatRequestPayload.ts'
      - 'utils/realPersonReplyPayload.test.ts'
      - 'apps/Chat.tsx'
      - 'utils/chatAutoReply.test.ts'
      - 'utils/chatInputPreferences.ts'
      - 'utils/realPersonMode.ts'
      - 'utils/realPersonMode.test.ts'
      - 'utils/realPersonReplyReadiness.ts'
      - 'utils/realPersonReplyReadiness.test.ts'
      - 'utils/realPersonReplyTiming.ts'
      - 'utils/realPersonReplyTiming.test.ts'
      - 'utils/realPersonReplyRhythm.ts'
      - 'utils/realPersonReplyRhythm.test.ts'
      - 'components/chat/RealPersonRhythmSettings.tsx'
      - 'components/chat/ChatModals.tsx'
      - 'types.ts'
      - 'components/chat/ChatInputSettings.tsx'
      - 'worker/amsg/src/**'
      - 'utils/amsgAutoUpdateTrigger*'
      - 'utils/amsgBundleVersion.ts'
      - 'utils/activeMsgClient.ts'
      - 'components/settings/ActiveMsgGlobalSettingsModal.tsx'
      - '.github/workflows/chat-auto-reply-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sully-chat-auto-reply-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test durable reply, schedule pacing, and cloud instant-chat compatibility
        env:
          SULLY_TEST_OFFLINE: '1'
        run: pnpm exec vitest run utils/chatParser.scheduleMessage.test.ts utils/legacyAiScheduledCleanup.test.ts utils/legacyMessageRetirement.test.ts utils/chatPrompts.scheduleTag.test.ts utils/amsg2CharToggle.wiring.test.ts utils/unsolicitedDeliveryGate.test.ts utils/unsolicitedDeliveryGate.wiring.test.ts utils/amsgDisabledRepair.test.ts utils/realPersonReplyPayload.test.ts utils/chatAutoReply.test.ts utils/realPersonMode.test.ts utils/realPersonReplyTiming.test.ts utils/realPersonReplyReadiness.test.ts utils/realPersonReplyRhythm.test.ts utils/realPersonReplyTurn.test.ts utils/chatSchedulePresence.test.ts utils/amsgInstantChat.test.ts worker/amsg/src/selfUpdate.test.ts worker/amsg/src/autoUpdate.test.ts utils/amsgAutoUpdateTrigger.test.ts
      - name: Compile SullyOS app with real-person reply rhythm integration
        run: pnpm run build
      - name: Check changed code TypeScript diagnostics
        shell: bash
        run: |
          pnpm exec tsc --noEmit --pretty false > /tmp/chat-reply-tsc.log 2>&1 || true
          grep -E '^(utils/legacyMessageRetirement.test.ts|utils/chatPrompts.scheduleTag.test.ts|apps/Settings.tsx|index.tsx|utils/legacyAiScheduledCleanup.ts|utils/legacyAiScheduledCleanup.test.ts|utils/chatParser.ts|utils/chatParser.scheduleMessage.test.ts|utils/db.ts|utils/unsolicitedDeliveryGate.ts|utils/unsolicitedDeliveryGate.test.ts|utils/unsolicitedDeliveryGate.wiring.test.ts|utils/amsgDisabledRepair.ts|utils/amsgDisabledRepair.test.ts|utils/activeMsgRuntime.ts|context/OSContext.tsx|components/chat/ActiveMsg2SettingsModal.tsx|hooks/useChatAutoReply.ts|hooks/useChatAI.ts|utils/amsgInstantChat.ts|utils/amsgInstantChat.test.ts|utils/chatContinuation.ts|utils/realPersonReplyTurn.ts|utils/realPersonReplyTurn.test.ts|utils/chatPrompts.ts|utils/chatRequestPayload.ts|utils/realPersonReplyPayload.test.ts|apps/Chat.tsx|utils/chatAutoReply.test.ts|utils/chatInputPreferences.ts|utils/realPersonMode.ts|utils/realPersonMode.test.ts|utils/realPersonReplyReadiness.ts|utils/realPersonReplyReadiness.test.ts|utils/realPersonReplyTiming.ts|utils/realPersonReplyTiming.test.ts|utils/realPersonReplyRhythm.ts|utils/realPersonReplyRhythm.test.ts|components/chat/RealPersonRhythmSettings.tsx|components/chat/ChatModals.tsx|types.ts|components/chat/ChatInputSettings.tsx|utils/amsgAutoUpdateTrigger.ts|utils/amsgBundleVersion.ts|utils/activeMsgClient.ts|worker/amsg/src/selfUpdate.ts|worker/amsg/src/index.ts|components/settings/ActiveMsgGlobalSettingsModal.tsx)[(]' /tmp/chat-reply-tsc.log > /tmp/chat-reply-target-errors.log || true
          if [ -s /tmp/chat-reply-target-errors.log ]; then
            cat /tmp/chat-reply-target-errors.log
            exit 1
          fi
