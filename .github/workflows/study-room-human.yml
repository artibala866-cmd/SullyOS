name: Study Room real user journeys
on:
  push:
    branches: [remove-checkphone-vrworld-lifesim]
    paths:
      - '.github/workflows/study-room-human.yml'
      - 'scripts/study-room-browser-qa.mjs'
      - 'apps/ScheduleApp.tsx'
      - 'apps/StudyApp.tsx'
      - 'apps/WorkspacePanel.tsx'
      - 'utils/sullyWorkspace.ts'
      - 'utils/db.ts'
      - 'utils/studyRoomCompanion.ts'
      - 'utils/studyFocusProgress.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: study-room-human-journeys
  cancel-in-progress: true
jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the real UI
        run: pnpm run build
      - name: Human learning journey, actual browser and disposable profile
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/study-room-browser-qa.mjs
          pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort >/tmp/human-qa-preview.log 2>&1 &
          server_pid=$!
          chrome_pid=''
          trap 'kill "$server_pid" "$chrome_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/human-qa-preview.log; exit 1; fi
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$browser" --headless=new --no-sandbox --disable-dev-shm-usage \
            --remote-debugging-port=9222 --remote-allow-origins='*' \
            --user-data-dir=/tmp/study-human-isolated-profile about:blank >/tmp/human-qa-chrome.log 2>&1 &
          chrome_pid=$!
          STUDY_HUMAN_MODE=1 STUDY_SCREENSHOT_DIR=/tmp/study-human-screens \
            node scripts/study-room-browser-qa.mjs 2>&1 | tee /tmp/study-human-results.log || {
              tail -80 /tmp/human-qa-chrome.log || true
              tail -80 /tmp/human-qa-preview.log || true
              exit 1
            }
          grep -q 'STUDY_HUMAN_CLASS_HOMEWORK_FOCUS=' /tmp/study-human-results.log
          grep -q 'STUDY_HUMAN_RESUME_PDF=' /tmp/study-human-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-room-real-human-journey-screens
          path: /tmp/study-human-screens/*.png
          if-no-files-found: ignore
