name: Study room independent checks
on:
  push:
    branches: [remove-checkphone-vrworld-lifesim]
    paths:
      - '.github/workflows/study-room-check.yml'
      - 'apps/ScheduleApp.tsx'
      - 'apps/StudyApp.tsx'
      - 'apps/WorkspacePanel.tsx'
      - 'apps/WorkspaceReminderControls.tsx'
      - 'utils/studyCourseLinks.ts'
      - 'utils/studyCourseLinks.test.ts'
      - 'utils/studyCourseLinks.wiring.test.ts'
      - 'utils/workspaceEditMerge.ts'
      - 'utils/workspaceEditMerge.test.ts'
      - 'utils/studyRoomFocusNotes.ts'
      - 'utils/studyRoomFocusNotes.test.ts'
      - 'utils/workspaceAudit.wiring.test.ts'
      - 'utils/workspaceIntegrity.test.ts'
      - 'utils/dailyCapacityForecast.test.ts'
      - 'utils/workspaceAtomic.wiring.test.ts'
      - 'utils/studyFocusProgress.ts'
      - 'utils/studyFocusProgress.test.ts'
      - 'utils/studyFocusProgress.wiring.test.ts'
      - 'utils/studyHomeworkReview.ts'
      - 'utils/studyHomeworkReview.test.ts'
      - 'utils/studyRoomDialogue.wiring.test.ts'
      - 'apps/StudyCommissionCalendar.tsx'
      - 'apps/StudyWeekTimetable.tsx'
      - 'apps/StudyCharPicker.tsx'
      - 'utils/studyCommissionCalendar.ts'
      - 'utils/studyCommissionCalendar.test.ts'
      - 'utils/studyRoomDesign.wiring.test.ts'
      - 'apps/StudyAvatar.tsx'
      - 'utils/studyAvatar.test.tsx'
      - 'utils/studyWeekTimetable.test.tsx'
      - 'apps/StudyHomeOverview.tsx'
      - 'utils/studyHomeOverview.test.tsx'
      - 'utils/studyHomeCompact.wiring.test.ts'
      - 'utils/studyQuickActions.ts'
      - 'utils/studyQuickActions.test.ts'
      - 'utils/studyRoomUsability.wiring.test.ts'
      - 'utils/studyRoomCompanion.ts'
      - 'utils/studyCoachWorkflow.ts'
      - 'utils/studyCoachWorkflow.test.ts'
      - 'utils/studyCoachWorkflow.wiring.test.ts'
      - 'utils/studyRoomLocalBackup.ts'
      - 'utils/studyRoomLocalBackup.test.ts'
      - 'utils/lsMirror.ts'
      - 'context/OSContext.tsx'
      - 'types.ts'
      - 'apps/StudyExecutionSlots.tsx'
      - 'scripts/study-room-browser-qa.mjs'
      - 'constants.tsx'
      - 'utils/studyRoomCompanion.test.ts'
      - 'utils/studyRoomCompanion.wiring.test.ts'
      - 'utils/studyCommissionEditor.test.ts'
      - 'apps/StudyCommissionEditor.tsx'
      - 'apps/StudyTimetableEditor.tsx'
      - 'utils/studyRoomPerformance.test.ts'
      - 'utils/studyHomeCompact.wiring.test.ts'
      - 'utils/db.ts'
      - 'utils/sullyWorkspace.ts'
      - 'utils/sullyWorkspace.test.ts'
      - 'utils/studyRoomReminders.ts'
      - 'utils/studyRoomReminders.test.ts'
      - 'utils/commissionPlanProposals.ts'
      - 'utils/commissionPlanProposals.test.ts'
      - 'utils/workspacePrivateChat.ts'
      - 'utils/workspacePrivateChat.test.ts'
      - 'utils/workspacePrivateChat.wiring.test.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sullyos-study-room-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test study room linking, permissions, planning and reminders
        run: |
          pnpm exec vitest run utils/sullyWorkspace.test.ts utils/studyRoomReminders.test.ts utils/workspacePrivateChat.test.ts utils/workspacePrivateChat.wiring.test.ts utils/commissionPlanProposals.test.ts utils/studyCourseLinks.test.ts utils/studyCourseLinks.wiring.test.ts utils/workspaceEditMerge.test.ts utils/studyRoomFocusNotes.test.ts utils/workspaceAudit.wiring.test.ts utils/workspaceIntegrity.test.ts utils/dailyCapacityForecast.test.ts utils/workspaceAtomic.wiring.test.ts utils/studyFocusProgress.test.ts utils/studyFocusProgress.wiring.test.ts utils/studyHomeworkReview.test.ts utils/studyRoomDialogue.wiring.test.ts utils/studyCommissionCalendar.test.ts utils/studyRoomDesign.wiring.test.ts utils/studyAvatar.test.tsx utils/studyWeekTimetable.test.tsx utils/studyHomeOverview.test.tsx utils/studyHomeCompact.wiring.test.ts utils/studyQuickActions.test.ts utils/studyRoomUsability.wiring.test.ts utils/studyCommissionEditor.test.ts utils/studyRoomPerformance.test.ts utils/studyHomeCompact.wiring.test.ts utils/studyRoomCompanion.test.ts utils/studyRoomCompanion.wiring.test.ts utils/studyCoachWorkflow.test.ts utils/studyCoachWorkflow.wiring.test.ts utils/studyRoomLocalBackup.test.ts utils/lsMirror.test.ts
      - name: Check study room TypeScript diagnostics
        shell: bash
        run: |
          pnpm exec tsc --noEmit --pretty false > /tmp/sully-study-room-tsc.log 2>&1 || true
          grep -E '^(utils/db.ts|apps/ScheduleApp.tsx|apps/StudyApp.tsx|apps/WorkspacePanel.tsx|apps/StudyExecutionSlots.tsx|constants.tsx|utils/studyCoachWorkflow.ts|utils/studyCoachWorkflow.test.ts|utils/studyCoachWorkflow.wiring.test.ts|utils/studyRoomLocalBackup.ts|utils/studyRoomLocalBackup.test.ts|utils/lsMirror.ts|context/OSContext.tsx|types.ts|apps/WorkspaceReminderControls.tsx|utils/sullyWorkspace.ts|utils/studyRoomReminders.ts|utils/commissionPlanProposals.ts|utils/workspacePrivateChat.ts|utils/studyCourseLinks.ts|utils/studyCourseLinks.test.ts|utils/studyCourseLinks.wiring.test.ts|utils/workspaceEditMerge.ts|utils/workspaceEditMerge.test.ts|utils/studyRoomFocusNotes.ts|utils/studyRoomFocusNotes.test.ts|utils/workspaceAudit.wiring.test.ts|utils/workspaceIntegrity.test.ts|utils/dailyCapacityForecast.test.ts|utils/workspaceAtomic.wiring.test.ts|utils/studyFocusProgress.ts|utils/studyFocusProgress.test.ts|utils/studyFocusProgress.wiring.test.ts|utils/studyHomeworkReview.ts|utils/studyHomeworkReview.test.ts|utils/studyRoomDialogue.wiring.test.ts|apps/StudyCommissionCalendar.tsx|apps/StudyWeekTimetable.tsx|apps/StudyCharPicker.tsx|utils/studyCommissionCalendar.ts|utils/studyCommissionCalendar.test.ts|utils/studyRoomDesign.wiring.test.ts|apps/StudyAvatar.tsx|utils/studyAvatar.test.tsx|utils/studyWeekTimetable.test.tsx|apps/StudyHomeOverview.tsx|utils/studyHomeOverview.test.tsx|utils/studyHomeCompact.wiring.test.ts|utils/studyQuickActions.ts|utils/studyQuickActions.test.ts|utils/studyRoomUsability.wiring.test.ts|utils/studyRoomCompanion.ts|utils/studyRoomCompanion.test.ts|utils/studyRoomCompanion.wiring.test.ts|utils/studyCommissionEditor.test.ts|apps/StudyCommissionEditor.tsx|apps/StudyTimetableEditor.tsx|utils/studyRoomPerformance.test.ts|utils/studyHomeCompact.wiring.test.ts)[(]' /tmp/sully-study-room-tsc.log > /tmp/sully-study-room-errors.log || true
          if [ -s /tmp/sully-study-room-errors.log ]; then
            cat /tmp/sully-study-room-errors.log
            exit 1
          fi
          echo "Study room target files have no TypeScript diagnostics."
      - name: Verify production application bundle
        run: pnpm run build
      - name: Run actual headless Chrome, inspect DOM and capture study-room screenshots
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$BROWSER" ]; then echo "No browser installed for real screenshot QA"; exit 1; fi
          pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/study-preview-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" "$CHROME_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ > /dev/null
          "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage \
            --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader \
            --remote-debugging-port=9222 --remote-allow-origins='*' \
            --user-data-dir=/tmp/sully-study-room-chrome about:blank > /tmp/sully-study-room-chrome.log 2>&1 &
          CHROME_PID=$!
          node scripts/study-room-browser-qa.mjs
      - name: Upload study-room screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-room-visual-smoke
          path: /tmp/study-room-screenshots/*.png
          retention-days: 7
