name: Study room independent checks
on:
  push:
    branches: [remove-checkphone-vrworld-lifesim]
    paths:
      - '.github/workflows/study-room-check.yml'
      - 'apps/ScheduleApp.tsx'
      - 'apps/StudyApp.tsx'
      - 'apps/WorkspacePanel.tsx'
      - 'apps/WorkspaceReminderControls.tsx'
      - 'utils/studyCourseLinks.ts'
      - 'utils/studyCourseLinks.test.ts'
      - 'utils/studyCourseLinks.wiring.test.ts'
      - 'utils/workspaceEditMerge.ts'
      - 'utils/workspaceEditMerge.test.ts'
      - 'utils/studyRoomFocusNotes.ts'
      - 'utils/studyRoomFocusNotes.test.ts'
      - 'utils/workspaceAudit.wiring.test.ts'
      - 'utils/workspaceIntegrity.test.ts'
      - 'utils/dailyCapacityForecast.test.ts'
      - 'utils/workspaceAtomic.wiring.test.ts'
      - 'utils/studyFocusProgress.ts'
      - 'utils/studyFocusProgress.test.ts'
      - 'utils/studyFocusProgress.wiring.test.ts'
      - 'utils/studyHomeworkReview.ts'
      - 'utils/studyHomeworkReview.test.ts'
      - 'utils/studyRoomDialogue.wiring.test.ts'
      - 'apps/StudyCommissionCalendar.tsx'
      - 'apps/StudyWeekTimetable.tsx'
      - 'apps/StudyCharPicker.tsx'
      - 'utils/studyCommissionCalendar.ts'
      - 'utils/studyCommissionCalendar.test.ts'
      - 'utils/studyRoomDesign.wiring.test.ts'
      - 'apps/StudyAvatar.tsx'
      - 'utils/studyAvatar.test.tsx'
      - 'utils/studyWeekTimetable.test.tsx'
      - 'apps/StudyHomeOverview.tsx'
      - 'utils/studyHomeOverview.test.tsx'
      - 'utils/studyHomeCompact.wiring.test.ts'
      - 'utils/studyQuickActions.ts'
      - 'utils/studyQuickActions.test.ts'
      - 'utils/studyRoomUsability.wiring.test.ts'
      - 'utils/studyRoomCompanion.ts'
      - 'utils/studyCoachWorkflow.ts'
      - 'utils/studyCoachWorkflow.test.ts'
      - 'utils/studyCoachWorkflow.wiring.test.ts'
      - 'apps/StudyExecutionSlots.tsx'
      - 'constants.tsx'
      - 'utils/studyRoomCompanion.test.ts'
      - 'utils/studyRoomCompanion.wiring.test.ts'
      - 'utils/studyCommissionEditor.test.ts'
      - 'apps/StudyCommissionEditor.tsx'
      - 'apps/StudyTimetableEditor.tsx'
      - 'utils/studyRoomPerformance.test.ts'
      - 'utils/studyHomeCompact.wiring.test.ts'
      - 'utils/db.ts'
      - 'utils/sullyWorkspace.ts'
      - 'utils/sullyWorkspace.test.ts'
      - 'utils/studyRoomReminders.ts'
      - 'utils/studyRoomReminders.test.ts'
      - 'utils/commissionPlanProposals.ts'
      - 'utils/commissionPlanProposals.test.ts'
      - 'utils/workspacePrivateChat.ts'
      - 'utils/workspacePrivateChat.test.ts'
      - 'utils/workspacePrivateChat.wiring.test.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sullyos-study-room-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test study room linking, permissions, planning and reminders
        run: |
          pnpm exec vitest run utils/sullyWorkspace.test.ts utils/studyRoomReminders.test.ts utils/workspacePrivateChat.test.ts utils/workspacePrivateChat.wiring.test.ts utils/commissionPlanProposals.test.ts utils/studyCourseLinks.test.ts utils/studyCourseLinks.wiring.test.ts utils/workspaceEditMerge.test.ts utils/studyRoomFocusNotes.test.ts utils/workspaceAudit.wiring.test.ts utils/workspaceIntegrity.test.ts utils/dailyCapacityForecast.test.ts utils/workspaceAtomic.wiring.test.ts utils/studyFocusProgress.test.ts utils/studyFocusProgress.wiring.test.ts utils/studyHomeworkReview.test.ts utils/studyRoomDialogue.wiring.test.ts utils/studyCommissionCalendar.test.ts utils/studyRoomDesign.wiring.test.ts utils/studyAvatar.test.tsx utils/studyWeekTimetable.test.tsx utils/studyHomeOverview.test.tsx utils/studyHomeCompact.wiring.test.ts utils/studyQuickActions.test.ts utils/studyRoomUsability.wiring.test.ts utils/studyCommissionEditor.test.ts utils/studyRoomPerformance.test.ts utils/studyHomeCompact.wiring.test.ts utils/studyRoomCompanion.test.ts utils/studyRoomCompanion.wiring.test.ts utils/studyCoachWorkflow.test.ts utils/studyCoachWorkflow.wiring.test.ts
      - name: Check study room TypeScript diagnostics
        shell: bash
        run: |
          pnpm exec tsc --noEmit --pretty false > /tmp/sully-study-room-tsc.log 2>&1 || true
          grep -E '^(utils/db.ts|apps/ScheduleApp.tsx|apps/StudyApp.tsx|apps/WorkspacePanel.tsx|apps/StudyExecutionSlots.tsx|constants.tsx|utils/studyCoachWorkflow.ts|utils/studyCoachWorkflow.test.ts|utils/studyCoachWorkflow.wiring.test.ts|apps/WorkspaceReminderControls.tsx|utils/sullyWorkspace.ts|utils/studyRoomReminders.ts|utils/commissionPlanProposals.ts|utils/workspacePrivateChat.ts|utils/studyCourseLinks.ts|utils/studyCourseLinks.test.ts|utils/studyCourseLinks.wiring.test.ts|utils/workspaceEditMerge.ts|utils/workspaceEditMerge.test.ts|utils/studyRoomFocusNotes.ts|utils/studyRoomFocusNotes.test.ts|utils/workspaceAudit.wiring.test.ts|utils/workspaceIntegrity.test.ts|utils/dailyCapacityForecast.test.ts|utils/workspaceAtomic.wiring.test.ts|utils/studyFocusProgress.ts|utils/studyFocusProgress.test.ts|utils/studyFocusProgress.wiring.test.ts|utils/studyHomeworkReview.ts|utils/studyHomeworkReview.test.ts|utils/studyRoomDialogue.wiring.test.ts|apps/StudyCommissionCalendar.tsx|apps/StudyWeekTimetable.tsx|apps/StudyCharPicker.tsx|utils/studyCommissionCalendar.ts|utils/studyCommissionCalendar.test.ts|utils/studyRoomDesign.wiring.test.ts|apps/StudyAvatar.tsx|utils/studyAvatar.test.tsx|utils/studyWeekTimetable.test.tsx|apps/StudyHomeOverview.tsx|utils/studyHomeOverview.test.tsx|utils/studyHomeCompact.wiring.test.ts|utils/studyQuickActions.ts|utils/studyQuickActions.test.ts|utils/studyRoomUsability.wiring.test.ts|utils/studyRoomCompanion.ts|utils/studyRoomCompanion.test.ts|utils/studyRoomCompanion.wiring.test.ts|utils/studyCommissionEditor.test.ts|apps/StudyCommissionEditor.tsx|apps/StudyTimetableEditor.tsx|utils/studyRoomPerformance.test.ts|utils/studyHomeCompact.wiring.test.ts)[(]' /tmp/sully-study-room-tsc.log > /tmp/sully-study-room-errors.log || true
          if [ -s /tmp/sully-study-room-errors.log ]; then
            cat /tmp/sully-study-room-errors.log
            exit 1
          fi
          echo "Study room target files have no TypeScript diagnostics."
      - name: Verify production application bundle
        run: pnpm run build
