name: Stage 4 cloud NPC life continuity
on:
  push:
    branches: [remove-checkphone-vrworld-lifesim]
    paths:
      - 'worker/amsg/src/index.ts'
      - 'utils/amsgCloudPhone*.ts'
      - 'utils/activeMsgClient.ts'
      - 'utils/amsgFirePack.ts'
      - 'utils/amsgResults.ts'
      - 'utils/amsgBundleVersion.ts'
      - 'utils/characterPhoneChats.ts'
      - 'utils/characterPhoneIdentity.ts'
      - 'context/OSContext.tsx'
      - '.github/workflows/character-life-stage4-cloud.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sully-stage4-cloud-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stage4:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test cloud phone consent, privacy, idempotence, and established AMSG continuity
        run: pnpm exec vitest run utils/amsgCloudPhone.test.ts utils/amsgCloudPhoneResultApply.test.ts utils/amsgAutonomyWake.test.ts utils/amsgAutonomyBootstrap.test.ts utils/characterPhoneAutonomy.test.ts utils/amsg2Tasks.test.ts
      - name: Check affected TypeScript modules
        shell: bash
        run: |
          pnpm exec tsc --noEmit --pretty false > /tmp/stage4-tsc.log 2>&1 || true
          grep -E '^(worker/amsg/src/index.ts|context/OSContext.tsx|utils/(amsgCloudPhone|amsgCloudPhoneSelection|amsgCloudPhoneResultApply|activeMsgClient|amsgFirePack|amsgResults|characterPhoneIdentity|characterPhoneChats)(\\.test)?\\.ts)[(]' /tmp/stage4-tsc.log > /tmp/stage4-errors.log || true
          if [ -s /tmp/stage4-errors.log ]; then cat /tmp/stage4-errors.log; exit 1; fi
          echo 'Stage 4 changed-module diagnostics clean.'
      - name: Compile actual Cloudflare Worker bundle
        run: pnpm build:workers
