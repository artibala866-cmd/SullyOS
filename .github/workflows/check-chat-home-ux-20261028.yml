name: Review chat and Home3D UX regressions
on:
  push:
    branches:
      - fix/chat-home-experience-regressions-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test photo capture and 3D lifecycle
        run: pnpm exec vitest run apps/room3d/HomePhotoMode.test.tsx utils/homeEditorLifecycle.test.ts utils/homePhotoSession.test.ts apps/room3d/dreamEntryLayout.test.js
      - name: Test private chat pipeline and removed-module isolation
        run: pnpm exec vitest run utils/chatPrompts.test.ts utils/timeAwarenessRequests.test.ts utils/homeChatPipelineParity.test.ts utils/retiredVrRuntime.test.ts
      - name: Scoped TypeScript check (exclude existing errors in unrelated modules)
        run: |
          pnpm exec tsc --noEmit > /tmp/tsc-errors.txt 2>&1 || true
          if grep -E '^(apps/(Chat|GroupChat)\.tsx|apps/room3d/(Home3DView|HomePhone|HomePhotoMode|HomePresenceBubbles)\.tsx)\([0-9]+,[0-9]+\): error TS' /tmp/tsc-errors.txt; then
            echo 'Audited chat or home modules still have TypeScript errors.'
            exit 1
          fi
          echo 'Audited chat/home files have no TypeScript errors; unrelated legacy diagnostics are tracked separately.'
      - name: Production build
        env:
          GITHUB_PAGES: '1'
        run: pnpm run build
