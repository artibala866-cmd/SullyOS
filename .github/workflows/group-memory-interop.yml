name: Group and private memory interoperability regression
on:
  push:
    branches: [remove-checkphone-vrworld-lifesim]
    paths:
      - '.github/workflows/group-memory-interop.yml'
      - 'apps/GroupChat.tsx'
      - 'utils/groupChat/**'
      - 'utils/memoryPalace/groupPipeline.ts'
      - 'utils/memoryPalace/groupPipeline.test.ts'
      - 'utils/memoryPalace/pipeline.ts'
      - 'utils/memoryPalace/vectorSearch.ts'
      - 'utils/chatContextRange.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sully-group-memory-interop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify group memory, message isolation, topic cards and member catch-up
        run: |
          pnpm exec vitest run utils/memoryPalace/groupPipeline.test.ts utils/groupChat/groupMemoryRename.test.ts utils/groupChat/topicCardSync.test.ts utils/groupChat/memoryScope.test.ts utils/groupChat/memberMemoryScope.test.ts utils/groupChat/timeline.test.ts utils/groupChat/topicBoxes.test.ts utils/groupChat/interactionAdaptation.test.ts
      - name: TypeScript diagnostics for memory integration
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tsc --noEmit --pretty false > /tmp/group-memory-tsc.log 2>&1 || true
          grep -E '^(apps/GroupChat.tsx|utils/chatContextRange.ts|utils/memoryPalace/(groupPipeline|pipeline|vectorSearch)(\\.test)?\\.ts|utils/groupChat/(groupMemoryRename|topicCardSync|memoryScope|memberMemoryScope|interactionAdaptation)(\\.test)?\\.ts)[(]' /tmp/group-memory-tsc.log > /tmp/group-memory-target-errors.log || true
          if [ -s /tmp/group-memory-target-errors.log ]; then cat /tmp/group-memory-target-errors.log; exit 1; fi
          echo 'Memory integration TypeScript diagnostics clean.'
      - name: Production build compatibility
        run: pnpm run build
