name: Build and publish SullyOS test site
on:
  push:
    branches: [remove-checkphone-vrworld-lifesim]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sullyos-pages
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test source-aware music, guest library and listening invitations
        run: pnpm exec vitest run utils/musicLibrary.test.ts utils/musicLibraryBackup.wiring.test.ts utils/musicPlaybackState.test.ts utils/musicTogether.test.ts utils/musicInviteStatus.test.ts
      - name: Check music TypeScript diagnostics
        shell: bash
        run: |
          pnpm exec tsc --noEmit --pretty false > /tmp/sully-music-tsc.log 2>&1 || true
          grep -E '^(context/MusicContext.tsx|apps/MusicApp.tsx|utils/musicLibrary.ts|utils/musicLibrary.test.ts|utils/musicLibraryBackup.wiring.test.ts|utils/musicPlaybackState.ts|utils/musicPlaybackState.test.ts|utils/db.ts|utils/musicTogether.test.ts|utils/musicInviteStatus.ts|utils/musicInviteStatus.test.ts|utils/chatParser.ts|types.ts)[(]' /tmp/sully-music-tsc.log > /tmp/sully-music-errors.log || true
          if [ -s /tmp/sully-music-errors.log ]; then
            cat /tmp/sully-music-errors.log
            exit 1
          fi
          echo "Music target files have no TypeScript diagnostics."
      - name: Test Sully workspace focus limits and commission planning
        run: pnpm exec vitest run utils/sullyWorkspace.test.ts utils/studyRoomReminders.test.ts utils/workspacePrivateChat.test.ts utils/workspacePrivateChat.wiring.test.ts utils/commissionPlanProposals.test.ts utils/studyCourseLinks.test.ts utils/studyCourseLinks.wiring.test.ts utils/workspaceEditMerge.test.ts utils/studyRoomFocusNotes.test.ts utils/workspaceAudit.wiring.test.ts utils/workspaceIntegrity.test.ts utils/dailyCapacityForecast.test.ts utils/workspaceAtomic.wiring.test.ts utils/studyFocusProgress.test.ts utils/studyFocusProgress.wiring.test.ts utils/studyHomeworkReview.test.ts utils/studyRoomDialogue.wiring.test.ts utils/studyCommissionCalendar.test.ts utils/studyRoomDesign.wiring.test.ts utils/studyAvatar.test.tsx
      - name: Check Sully workspace TypeScript diagnostics
        shell: bash
        run: |
          pnpm exec tsc --noEmit --pretty false > /tmp/sully-workspace-tsc.log 2>&1 || true
          grep -E '^(utils/db.ts|apps/ScheduleApp.tsx|apps/WorkspacePanel.tsx|apps/WorkspaceReminderControls.tsx|apps/StudyApp.tsx|utils/sullyWorkspace.ts|utils/sullyWorkspace.test.ts|utils/studyRoomReminders.ts|utils/studyRoomReminders.test.ts|utils/sullyTimetableVision.ts|utils/workspacePrivateChat.ts|utils/workspacePrivateChat.test.ts|utils/workspacePrivateChat.wiring.test.ts|utils/commissionPlanProposals.ts|utils/commissionPlanProposals.test.ts|utils/studyCourseLinks.ts|utils/studyCourseLinks.test.ts|utils/studyCourseLinks.wiring.test.ts|utils/workspaceEditMerge.ts|utils/workspaceEditMerge.test.ts|utils/studyRoomFocusNotes.ts|utils/studyRoomFocusNotes.test.ts|utils/workspaceAudit.wiring.test.ts|utils/workspaceIntegrity.test.ts|utils/dailyCapacityForecast.test.ts|utils/workspaceAtomic.wiring.test.ts|utils/studyFocusProgress.ts|utils/studyFocusProgress.test.ts|utils/studyFocusProgress.wiring.test.ts|utils/studyHomeworkReview.ts|utils/studyHomeworkReview.test.ts|utils/studyRoomDialogue.wiring.test.ts|apps/StudyCommissionCalendar.tsx|apps/StudyWeekTimetable.tsx|apps/StudyCharPicker.tsx|utils/studyCommissionCalendar.ts|utils/studyCommissionCalendar.test.ts|utils/studyRoomDesign.wiring.test.ts|apps/StudyAvatar.tsx|utils/studyAvatar.test.tsx|hooks/useChatAI.ts|constants.tsx)[(]' /tmp/sully-workspace-tsc.log > /tmp/sully-workspace-target-errors.log || true
          if [ -s /tmp/sully-workspace-target-errors.log ]; then
            cat /tmp/sully-workspace-target-errors.log
            exit 1
          fi
          echo "Sully workspace target files have no TypeScript diagnostics."
      - name: Test chat auto reply, keyboard dismissal and grounded life fragments
        run: pnpm exec vitest run utils/chatAutoReply.test.ts utils/realPersonReplyTiming.test.ts utils/chatSchedulePresence.test.ts utils/amsgScheduleShortcut.test.ts utils/amsgAutonomyWake.test.ts utils/amsgAutonomyLock.test.ts utils/amsgChatGenerationLease.test.ts utils/amsgAutonomyPolicy.test.ts utils/amsgP1CrossDay.test.ts utils/amsgPhoneEvent.test.ts utils/characterPhoneBrowserAutonomy.test.ts utils/characterPhoneSelfProfile.test.ts utils/characterLifeEventsPrivateDeletion.test.ts utils/amsgVerifiedXhs.test.ts utils/chatKeyboardViewport.test.ts utils/characterLifeGlimpses.test.ts utils/characterLifeGlimpseGeneration.test.ts utils/characterLifeEventGlimpse.test.ts
      - name: Test cloud-message provenance in atomic private-chat cleanup
        run: pnpm exec vitest run utils/chatHistoryCleanup.test.ts -t "云端私聊的清空预览"
      - name: Test AMSG2 stale conversation protection (worker simulation)
        run: |
          pnpm exec vitest run worker/amsg/src/index.test.ts -t "onBeforeFire 四道门|连发上限（到点兜底闸）"
          pnpm exec vitest run utils/amsgStateSync.test.ts
      - name: Build AMSG2 Worker bundles before unrelated long regression tests
        run: pnpm run build:workers
      # Node 22 + SQLite D1 emulator + real VAPID RFC8291 encrypted push.
      # This is the actual Worker bundle produced in the previous step, not
      # just a mocked fire-hook unit test. No real user/device is contacted.
      - name: Preserve exact P0 Worker bundle for manual Cloudflare deployment
        uses: actions/upload-artifact@v4
        with:
          name: amsg-worker-p0-${{ github.sha }}
          path: worker/amsg/worker.bundle.js
          if-no-files-found: error
          retention-days: 30
      - name: P0 Worker end-to-end delivery rehearsal (D1, cron, encrypted push, LLM)
        run: node scripts/amsg2-p0-e2e.mjs
      - name: P0 offline inbox receipt, de-duplication and private-chat persistence
        run: |
          # activeMsgRuntime.test.ts still imports deleted vrWorld/SAR test helpers.
          # Keep this P0 gate on runnable inbox/arrival/push suites; do not
          # resurrect the removed VR runtime just for a legacy test fixture.
          pnpm exec vitest run utils/activeMsgRuntime.beforeChat.test.ts utils/amsgResults.test.ts utils/pushSubscribeShared.test.ts utils/amsgPhoneEvent.test.ts
      - name: Check real-person reply scheduler TypeScript diagnostics
        shell: bash
        run: |
          pnpm exec tsc --noEmit --pretty false > /tmp/real-person-tsc.log 2>&1 || true
          grep -E '^(hooks/useChatAutoReply.ts|utils/realPersonReplyTiming.ts|utils/chatSchedulePresence.ts|utils/amsgScheduleShortcut.ts|utils/amsgAutonomyWake.ts|utils/amsgAutonomyWake.test.ts|utils/amsgBundleVersion.ts|utils/amsgAutoUpdateTrigger.ts|utils/realPersonReplyTiming.test.ts|utils/chatSchedulePresence.test.ts|utils/amsgScheduleShortcut.test.ts|apps/Chat.tsx|components/chat/ChatInputArea.tsx|components/chat/ChatHeaderShell.tsx|components/chat/ActiveMsg2SettingsModal.tsx)[(]' /tmp/real-person-tsc.log > /tmp/real-person-target-errors.log || true
          if [ -s /tmp/real-person-target-errors.log ]; then
            cat /tmp/real-person-target-errors.log
            exit 1
          fi
          echo "Real-person reply scheduler has no TypeScript diagnostics."
      - name: Test deleted WeChat privacy and life-glimpse revocation
        run: pnpm exec vitest run utils/characterPhoneChatDeletion.test.ts utils/characterLifeEventsPrivateDeletion.test.ts utils/characterPhoneClear.test.ts utils/characterLifeEventGlimpse.test.ts
      - name: Check independent life feature TypeScript diagnostics
        shell: bash
        run: |
          pnpm exec tsc --noEmit --pretty false > /tmp/life-tsc.log 2>&1 || true
          grep -E '^(utils/characterLifeGlimpseGeneration.ts|utils/characterLifeGlimpseGeneration.test.ts|utils/characterLifeEventGlimpse.test.ts|utils/characterLifeEvents.ts|components/chat/CharacterPhone.tsx)[(]' /tmp/life-tsc.log > /tmp/life-target-errors.log || true
          if [ -s /tmp/life-target-errors.log ]; then
            cat /tmp/life-target-errors.log
            exit 1
          fi
          echo "Independent life feature has no TypeScript diagnostics."
      - name: Check modified backup integration TypeScript diagnostics
        shell: bash
        run: |
          pnpm exec tsc --noEmit --pretty false > /tmp/backup-tsc.log 2>&1 || true
          grep -E '^(context/OSContext.tsx|utils/backupArchive.ts|utils/backupStoreStreaming.ts|utils/backupFormat.ts|utils/backupBlobs.ts|utils/voiceMessageBackup.ts|utils/companionVoiceAssets.ts|utils/memoryPalace/memoryEmbeddings.ts|utils/memoryPalace/vectorStore.ts|utils/phoneLegacyBackup.ts|utils/phoneLegacyBackup.test.ts)[(]' /tmp/backup-tsc.log > /tmp/backup-target-errors.log || true
          if [ -s /tmp/backup-target-errors.log ]; then
            cat /tmp/backup-target-errors.log
            exit 1
          fi
          echo "Character-phone backup integration has no TypeScript diagnostics."
      - name: Test phone backup identity, privacy, and Spark draft protection
        run: pnpm exec vitest run utils/phoneLegacyBackup.test.ts utils/socialFeedMerge.test.ts
      - name: Check STT provider and custom Call UI TypeScript diagnostics
        shell: bash
        run: |
          pnpm exec tsc --noEmit --pretty false > /tmp/stt-tsc.log 2>&1 || true
          grep -E '^(apps/CallApp.tsx|components/call/CallPreferencesSheet.tsx|utils/callAudioFeed.ts|hooks/useStreamingVoice.ts|components/voice/StreamingVoiceBar.tsx|utils/voiceStream.ts|utils/elevenLabsStream.ts|utils/incrementalCallSpeech.ts|utils/speechToText.ts|utils/speechToText.test.ts|api/minimax/stt.ts|api/fishaudio/stt.ts|api/elevenlabs/stt.ts|utils/elevenLabsTts.ts|utils/elevenLabsModels.ts|utils/ttsRouter.ts|utils/elevenLabsTts.test.ts)[(]' /tmp/stt-tsc.log > /tmp/stt-target-errors.log || true
          if [ -s /tmp/stt-target-errors.log ]; then
            cat /tmp/stt-target-errors.log
            exit 1
          fi
          echo "STT routes and custom Call UI have no TypeScript diagnostics."
      - name: Test long memory, streaming voice and large backup regression
        run: >-
          pnpm exec vitest run
          utils/memoryPalace/memoryEmbeddings.test.ts
          utils/backupArchive.test.ts
          utils/backupStoreStreaming.test.ts
          utils/voiceStream.test.ts
          utils/elevenLabsStream.test.ts
          utils/incrementalCallSpeech.test.ts
          utils/streamingVoice.lifecycle.test.ts
          worker/elevenlabs-stream.test.ts
      - name: Test ElevenLabs v4 models, voice tags and preserved Flash defaults
        run: pnpm exec vitest run utils/elevenLabsTts.test.ts
      - name: Test official speech-to-text key guards and provider routes
        run: pnpm exec vitest run utils/speechToText.test.ts
      - name: Test official delivery branch build badge and debug gate
        run: pnpm exec vitest run scripts/buildBadgeVisibility.test.ts
      - name: Test reusable 3D motion templates and navigation
        run: pnpm exec vitest run apps/room3d/homePhoneLayout.test.js apps/room3d/dreamEntryLayout.test.js apps/room3d/entryWarmup.test.ts apps/room3d/automaticWalls.test.js apps/room3d/renderQuality.test.js apps/room3d/chibi/motionTemplates.test.ts apps/room3d/chibi/headPatMotion.test.ts apps/room3d/chibi/rearHugMotion.test.ts apps/room3d/chibi/handHoldPleadMotion.test.ts apps/room3d/chibi/sofaLapPillowMotion.test.ts apps/room3d/chibi/standingHeightAdaptation.test.ts apps/room3d/chibi/motionContactProfiles.test.ts apps/room3d/chibi/motionConstraintPipeline.test.ts apps/room3d/chibi/faceContactProfiles.test.ts apps/room3d/chibi/templateFaceContact.test.ts apps/room3d/chibi/socialPropsTemplate.test.ts apps/room3d/navigation.test.js apps/room3d/socialSpace.test.js
      - name: Test 3D home thought-bubble entry timing and avatar spacing
        run: pnpm exec vitest run utils/homePresenceBubbles.test.ts
      - name: Test home photo capture, lifecycle, and cleanup
        run: pnpm exec vitest run apps/room3d/HomePhotoMode.test.tsx utils/homeEditorLifecycle.test.ts utils/homePhotoSession.test.ts
      - name: Test music guest fallback and lyrics
        run: pnpm exec vitest run utils/musicTogether.test.ts utils/musicInviteStatus.test.ts utils/musicWorkerUrl.test.ts utils/chatMessageVisibility.test.ts utils/homeHistoryCleanup.test.ts utils/homeHistoryButton.test.ts
      - name: Test web update and resource caching
        run: pnpm exec vitest run utils/appPreload.test.ts utils/webUpdateSession.test.ts utils/chunkLoadRecovery.test.ts worker/staticCache.test.ts worker/staticCacheLifecycle.test.ts scripts/static-cache-build.test.ts
      - name: Test character phone NPC autonomy and social loop
        run: pnpm exec vitest run utils/refreshNpcMoments.test.ts utils/phoneChatPiggyback.test.ts utils/characterPhoneAiRequest.test.ts utils/characterPhoneAutonomy.test.ts utils/characterNpcSocial.test.ts utils/characterLifeLoop.test.ts
      - name: Test private-chat time awareness and NPC continuity
        run: pnpm exec vitest run utils/chatPrompts.test.ts utils/timeAwarenessRequests.test.ts utils/relationshipChat.test.ts
      - name: Test Char wallet assets and real Baidu browser
        run: pnpm exec vitest run utils/characterPhoneWallet.test.ts utils/characterPhoneBrowser.test.ts
      - name: Test Char AI browser motives and avatar vision personalization
        run: pnpm exec vitest run utils/characterPhoneBrowserAutonomy.test.ts utils/characterPhoneSelfProfile.test.ts
      - name: Test shared Char API quota and avatar vision backfill
        run: pnpm exec vitest run utils/characterPhoneApiBudget.test.ts utils/characterAvatarVisionBudget.test.ts utils/characterAvatarMood.test.ts utils/characterPhoneAppInstall.test.ts utils/characterPhoneApiConfig.test.ts utils/characterPhoneSocialContent.test.ts utils/characterPhoneAppearance.test.ts utils/characterPhoneHomeLayout.test.ts utils/characterPhoneInboxPrefs.test.ts utils/characterPhonePayments.test.ts utils/characterPhoneClear.test.ts
      - name: Audit remaining retired VR dependencies
        run: node scripts/audit-retired-vr-dependencies.mjs
      - name: Test legacy figure migration and runtime isolation
        run: pnpm exec vitest run utils/retiredVrFigureMigration.test.ts utils/retiredVrRuntime.test.ts
      - name: Build original SullyOS for GitHub Pages
        env:
          GITHUB_PAGES: '1'
        run: pnpm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
