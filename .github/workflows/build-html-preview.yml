name: Build and publish SullyOS test site
on:
  push:
    branches: [remove-checkphone-vrworld-lifesim]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sullyos-pages
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test reusable 3D motion templates and navigation
        run: pnpm exec vitest run apps/room3d/chibi/motionTemplates.test.ts apps/room3d/chibi/headPatMotion.test.ts apps/room3d/chibi/motionContactProfiles.test.ts apps/room3d/chibi/motionConstraintPipeline.test.ts apps/room3d/chibi/faceContactProfiles.test.ts apps/room3d/chibi/templateFaceContact.test.ts apps/room3d/chibi/socialPropsTemplate.test.ts apps/room3d/navigation.test.js apps/room3d/socialSpace.test.js
      - name: Test music guest fallback and lyrics
        run: pnpm exec vitest run utils/musicTogether.test.ts utils/musicInviteStatus.test.ts utils/musicWorkerUrl.test.ts utils/chatMessageVisibility.test.ts
      - name: Test web update and resource caching
        run: pnpm exec vitest run utils/appPreload.test.ts utils/webUpdateSession.test.ts utils/chunkLoadRecovery.test.ts worker/staticCache.test.ts worker/staticCacheLifecycle.test.ts scripts/static-cache-build.test.ts
      - name: Test character phone NPC autonomy and social loop
        run: pnpm exec vitest run utils/characterPhoneAutonomy.test.ts utils/characterNpcSocial.test.ts utils/characterLifeLoop.test.ts
      - name: Test Char wallet assets and real Baidu browser
        run: pnpm exec vitest run utils/characterPhoneWallet.test.ts utils/characterPhoneBrowser.test.ts
      - name: Test Char AI browser motives and avatar vision personalization
        run: pnpm exec vitest run utils/characterPhoneBrowserAutonomy.test.ts utils/characterPhoneSelfProfile.test.ts
      - name: Test shared Char API quota and avatar vision backfill
        run: pnpm exec vitest run utils/characterPhoneApiBudget.test.ts utils/characterAvatarVisionBudget.test.ts utils/characterAvatarMood.test.ts utils/characterPhoneAppInstall.test.ts utils/characterPhoneApiConfig.test.ts utils/characterPhoneSocialContent.test.ts utils/characterPhoneAppearance.test.ts
      - name: Audit remaining retired VR dependencies
        run: node scripts/audit-retired-vr-dependencies.mjs
      - name: Test legacy figure migration and runtime isolation
        run: pnpm exec vitest run utils/retiredVrFigureMigration.test.ts utils/retiredVrRuntime.test.ts
      - name: Build original SullyOS for GitHub Pages
        env:
          GITHUB_PAGES: '1'
        run: pnpm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
