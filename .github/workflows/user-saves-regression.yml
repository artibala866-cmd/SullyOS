name: User identity saves regression and screenshots
on:
  push:
    branches: [remove-checkphone-vrworld-lifesim]
    paths:
      - 'apps/UserApp.tsx'
      - 'experiments/chibi/wardrobe.tsx'
      - 'experiments/chibi/main.tsx'
      - 'context/OSContext.tsx'
      - 'components/PhoneShell.tsx'
      - 'apps/Settings.tsx'
      - 'components/user/*.tsx'
      - 'components/character/CreatorIframe.tsx'
      - 'components/character/HomeFigureStudio.tsx'
      - 'components/lifeRecord/LifeRecordPanel.tsx'
      - 'public/like520/character_creator.html'
      - 'utils/homeFigureSource.test.ts'
      - 'utils/userProfilePersistence.test.ts'
      - 'utils/userSave*.ts'
      - 'utils/db.ts'
      - 'utils/memoryPalace/supabaseVector.ts'
      - 'scripts/test-user-saves.mjs'
      - 'scripts/check-user-saves-types.mjs'
      - 'test/fixtures/user-saves.*'
      - '.github/workflows/user-saves-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: user-saves-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Storage and existing backup regressions
        run: pnpm exec vitest run utils/userSaves.test.ts utils/userSaveCreatorDraft.test.ts utils/userProfilePersistence.test.ts utils/homeFigureSource.test.ts utils/lifeRecords.test.ts utils/userSaveBackup.test.ts utils/db.test.ts utils/backupRoundtrip.test.ts utils/lsMirror.test.ts utils/collaborationStore.test.ts utils/collaborationWiring.test.ts utils/storageStats.test.ts utils/storyTheaterLegacyDbUpgrade.test.ts
      - name: Check changed TypeScript files
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: node scripts/check-user-saves-types.mjs
      - name: Install browser tooling outside the source package
        run: |
          mkdir -p /tmp/user-save-browser
          pnpm --dir /tmp/user-save-browser add playwright@1.56.1
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -n "$chrome" ]; then
            echo "USER_SAVE_CHROMIUM=$chrome" >> "$GITHUB_ENV"
          else
            pnpm --dir /tmp/user-save-browser exec playwright install --with-deps chromium
          fi
          mkdir -p "$HOME/.local/share/fonts"
          curl -fL --retry 2 --max-time 60 https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf -o "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf"
          fc-cache -f "$HOME/.local/share/fonts"
      - name: Real archive A/B/A/B and mobile screenshots
        shell: bash
        env:
          USER_SAVE_PLAYWRIGHT: /tmp/user-save-browser/node_modules/playwright/index.mjs
          USER_SAVE_SHOTS: output/user-saves
        run: |
          set -euo pipefail
          pnpm exec vite --host 127.0.0.1 --port 5192 --strictPort >/tmp/user-save-vite.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node scripts/test-user-saves.mjs
      - name: Production build
        run: pnpm build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-saves-real-archive-screenshots
          path: output/user-saves/*.png
          if-no-files-found: ignore
          retention-days: 7
