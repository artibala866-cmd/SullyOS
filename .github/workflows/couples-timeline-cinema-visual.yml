name: Couples timeline cinema mobile visual regression
on:
  push:
    branches: [remove-checkphone-vrworld-lifesim]
    paths:
      - 'apps/couplesSpace/records.tsx'
      - 'apps/couplesSpace/timelineCinema.*'
      - 'apps/CouplesSpaceApp.tsx'
      - 'tests/couples-timeline-cinema-visual.*'
      - '.github/workflows/couples-timeline-cinema-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: couples-timeline-cinema-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check original couples logic and app compilation
        run: |
          pnpm exec vitest run utils/couplesSpace.test.ts
          pnpm exec vite build
      - name: Verify timeline-specific TypeScript
        shell: bash
        run: |
          pnpm exec tsc --noEmit --pretty false >/tmp/timeline-tsc.log 2>&1 || true
          grep -E '^(apps/couplesSpace/(timelineCinema|records)\.tsx|tests/couples-timeline-cinema-visual\.tsx)[(]' /tmp/timeline-tsc.log > /tmp/timeline-target-errors.txt || true
          if test -s /tmp/timeline-target-errors.txt; then cat /tmp/timeline-target-errors.txt; exit 1; fi
      - name: Install Chinese fonts and Chrome
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Screenshot actual BondRecords components at mobile sizes
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vite --host 127.0.0.1 --port 5173 --strictPort >/tmp/timeline-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/tests/couples-timeline-cinema-visual.html >/dev/null; then break; fi
            sleep 1
          done
          chrome="${{ steps.chrome.outputs.chrome-path }}"
          mkdir -p timeline-cinema-screenshots
          for state in populated empty detail editor handbook swipe-mode swipe-frame; do
            url="http://127.0.0.1:5173/tests/couples-timeline-cinema-visual.html?state=$state"
            "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
              --window-size=430,940 --force-device-scale-factor=1 \
              --virtual-time-budget=7000 --dump-dom "$url" > "/tmp/timeline-$state-dom.txt" 2>/tmp/timeline-chrome.log
            grep -q 'data-ready="true"' "/tmp/timeline-$state-dom.txt" || { tail -60 /tmp/timeline-vite.log; tail -40 /tmp/timeline-chrome.log; exit 1; }
            grep -q 'data-overflow="false"' "/tmp/timeline-$state-dom.txt" || { echo "Horizontal overflow in $state"; exit 1; }
            if [[ "$state" == "handbook" || "$state" == "swipe-mode" ]]; then
              grep -q 'data-handbook="true"' "/tmp/timeline-$state-dom.txt" || { echo "Handbook transition failed: $state"; exit 1; }
            fi
            if [[ "$state" == "empty" ]]; then
              grep -q 'data-leader="true"' "/tmp/timeline-$state-dom.txt" || { echo 'Empty film leader missing'; exit 1; }
            fi
            if [[ "$state" == "swipe-frame" ]]; then
              grep -Eq 'data-activeframe="02[[:space:]]*/[[:space:]]*04"' "/tmp/timeline-$state-dom.txt" || { echo 'Frame swipe failed'; exit 1; }
            fi
            "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars \
              --window-size=430,940 --force-device-scale-factor=1 \
              --virtual-time-budget=7000 --screenshot="$GITHUB_WORKSPACE/timeline-cinema-screenshots/$state.png" "$url"
            test -s "timeline-cinema-screenshots/$state.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timeline-cinema-mobile-screenshots
          path: timeline-cinema-screenshots/
          if-no-files-found: warn
          retention-days: 14
