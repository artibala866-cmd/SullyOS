name: Weixin whitebox native visual
on:
  push:
    branches: [remove-checkphone-vrworld-lifesim]
    paths:
      - 'presets/chat/weixin-baiyu.json'
      - 'apps/Chat.tsx'
      - 'apps/GroupChat.tsx'
      - 'components/chat/BlobRefStyle.tsx'
      - 'components/chat/ChatDecorationSample.tsx'
      - 'components/chat/ChatHeaderShell.tsx'
      - 'components/chat/ChatInputArea.tsx'
      - 'components/chat/ChatImage.tsx'
      - 'components/chat/MessageItem.tsx'
      - 'utils/builtinWhitebox.ts'
      - 'utils/builtinWhitebox.test.ts'
      - 'tests/weixin-whitebox-visual.*'
      - '.github/workflows/weixin-whitebox-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check decoration compatibility and complete theme
        run: pnpm exec vitest run utils/builtinWhitebox.test.ts utils/chatDecoration.test.ts
      - name: Build chat preview CSS
        run: pnpm run build:chat-preview
      - name: Capture author-supplied icon files and verify reachable assets
        shell: bash
        run: |
          mkdir -p weixin-original-assets
          urls=(
            "voice:https://nos.netease.com/vcloud-statistic/nrtc/17ec3907-e615-4349-a269-9f716cf59489.png"
            "sticker:https://nos.netease.com/vcloud-statistic/nrtc/da835c40-d3c7-4462-ad4b-5c598284837b.png"
            "action:https://nos.netease.com/vcloud-statistic/nrtc/4f7329f5-0fbc-4871-98ea-b2223db71efb.png"
            "microphone:https://nos.netease.com/vcloud-statistic/nrtc/59f469f5-0c70-43ce-ae1e-4c633e9a4e9a.png"
          )
          for item in "${urls[@]}"; do
            key="${item%%:*}"
            url="${item#*:}"
            if curl --fail --location --retry 2 --max-time 12 --silent --show-error "$url" -o "weixin-original-assets/${key}.png"; then
              file "weixin-original-assets/${key}.png"
            else
              rm -f "weixin-original-assets/${key}.png"
              echo "::warning::Original ${key} asset unavailable; native glyph fallback remains visible"
            fi
          done
      - name: Install Chinese glyphs for actual rendered text checks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Chromium screenshot of native chat components
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vite --host 127.0.0.1 --port 5173 --strictPort >/tmp/weixin-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:5173/tests/weixin-whitebox-visual.html >/dev/null; then break; fi
            sleep 1
          done
          chrome="${{ steps.chrome.outputs.chrome-path }}"
          "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --window-size=1640,2170 --virtual-time-budget=15000 --dump-dom http://127.0.0.1:5173/tests/weixin-whitebox-visual.html > /tmp/weixin-dom.txt 2>/tmp/weixin-chrome.log || true
          "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1640,2170 --virtual-time-budget=15000 --screenshot="$GITHUB_WORKSPACE/weixin-native-chat.png" http://127.0.0.1:5173/tests/weixin-whitebox-visual.html
          if ! grep -q 'data-ready="true"' /tmp/weixin-dom.txt; then
            grep -o '<output[^>]*>[^<]*</output>' /tmp/weixin-dom.txt | head -8 || true
            tail -60 /tmp/weixin-vite.log || true
            tail -40 /tmp/weixin-chrome.log || true
            exit 1
          fi
          test -s weixin-native-chat.png
          "$chrome" --headless=new --force-dark-mode --no-sandbox --disable-dev-shm-usage --disable-gpu --window-size=1640,2170 --virtual-time-budget=15000 --dump-dom http://127.0.0.1:5173/tests/weixin-whitebox-visual.html > /tmp/weixin-dark-dom.txt 2>/tmp/weixin-dark-chrome.log || true
          "$chrome" --headless=new --force-dark-mode --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1640,2170 --virtual-time-budget=15000 --screenshot="$GITHUB_WORKSPACE/weixin-native-chat-dark.png" http://127.0.0.1:5173/tests/weixin-whitebox-visual.html
          if ! grep -q 'data-ready="true"' /tmp/weixin-dark-dom.txt; then
            grep -o '<output[^>]*>[^<]*</output>' /tmp/weixin-dark-dom.txt | head -8 || true
            exit 1
          fi
          test -s weixin-native-chat-dark.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weixin-author-original-icons
          path: weixin-original-assets/*.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weixin-native-chat-screenshot
          path: |
            weixin-native-chat.png
            weixin-native-chat-dark.png
          if-no-files-found: ignore
          retention-days: 7
