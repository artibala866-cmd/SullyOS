name: Character message recall real-component visual and DB regression
on:
  push:
    branches: [remove-checkphone-vrworld-lifesim]
    paths:
      - 'utils/messageRecall*'
      - 'utils/db.ts'
      - 'utils/applyAssistantPostProcessing.ts'
      - 'utils/chatRequestPayload.ts'
      - 'utils/chatPrompts.ts'
      - 'utils/streamPreview.ts'
      - 'components/chat/MessageItem.tsx'
      - 'tests/character-recall-visual.*'
      - '.github/workflows/character-recall-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: character-recall-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 9}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: Run real IndexedDB mutation, matching and parser regression
        run: pnpm exec vitest run utils/messageRecall.test.ts utils/messageRecall.integration.test.ts
      - name: Check TypeScript diagnostics for all affected code
        shell: bash
        run: |
          pnpm exec tsc --noEmit --pretty false >/tmp/recall-tsc.log 2>&1 || true
          grep -E '^(utils/(db|messageRecall|applyAssistantPostProcessing|chatRequestPayload|chatPrompts|streamPreview)\\.ts|components/chat/MessageItem\\.tsx|tests/character-recall-visual\\.ts)\\(' /tmp/recall-tsc.log >/tmp/recall-tsc-errors.log || true
          if [ -s /tmp/recall-tsc-errors.log ]; then cat /tmp/recall-tsc-errors.log; exit 1; fi
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with: {chrome-version: stable}
      - name: Install Chinese fonts for accurate mobile screenshot
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Mobile screenshot of real MessageItem recall status
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vite --host 127.0.0.1 --port 5173 --strictPort >/tmp/recall-vite.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173/tests/character-recall-visual.html >/dev/null; then break; fi
            sleep 1
          done
          chrome="${{ steps.chrome.outputs.chrome-path }}"
          "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --window-size=390,850 --virtual-time-budget=12000 --dump-dom \
            http://127.0.0.1:5173/tests/character-recall-visual.html >/tmp/recall-dom.html 2>/tmp/recall-chrome.log || true
          "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --window-size=390,850 --hide-scrollbars --virtual-time-budget=12000 \
            --screenshot="$GITHUB_WORKSPACE/character-recall-real-390.png" \
            http://127.0.0.1:5173/tests/character-recall-visual.html
          test -s character-recall-real-390.png
          if ! grep -q 'data-recall-visual-ready="true"' /tmp/recall-dom.html; then
            grep -o '<output id="recall-visual-checks"[^<]*[^<]*' /tmp/recall-dom.html | head -c 1200 || true
            grep -o 'data-recall-visual-error="[^"]*"' /tmp/recall-dom.html | head -c 1500 || true
            tail -70 /tmp/recall-vite.log || true
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-recall-real-ui
          path: character-recall-real-390.png
          if-no-files-found: ignore
          retention-days: 7
