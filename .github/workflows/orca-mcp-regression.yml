name: Orca realtime MCP regression

on:
  push:
    branches: [remove-checkphone-vrworld-lifesim]
    paths:
      - 'utils/mcpClient.ts'
      - 'utils/orcaMcpFallback.test.ts'
      - 'worker/index.js'
      - 'worker/orcaMcpProxy.test.ts'
      - '.github/workflows/orca-mcp-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-orca:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout existing development branch
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify fixed-origin relay and browser recovery
        run: pnpm exec vitest run worker/orcaMcpProxy.test.ts utils/orcaMcpFallback.test.ts
      - name: Build Orca MCP client and UI entrypoints
        run: pnpm exec esbuild utils/mcpClient.ts components/settings/RealtimeMcpPresets.tsx --bundle --platform=browser --format=esm --outdir=/tmp/orca-mcp-build
      - name: Probe the live public Worker route (informational)
        continue-on-error: true
        run: |
          node --input-type=module -e '
            const url = "https://proxy.friedsully.com/mcp/orca";
            try {
              const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
              console.log("Live Orca route GET status:", response.status);
              if (response.status !== 405) {
                console.error("Expected 405 for existing POST-only Orca route; route may not be deployed.");
                process.exitCode = 1;
              }
            } catch (error) {
              console.error("Live Worker probe failed:", error.message);
              process.exitCode = 1;
            }
          '
