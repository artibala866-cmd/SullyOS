name: Private chat user voice regression
on:
  push:
    branches: [remove-checkphone-vrworld-lifesim]
    paths:
      - 'apps/Chat.tsx'
      - 'components/chat/ChatInputArea.tsx'
      - 'components/chat/MessageItem.tsx'
      - 'components/chat/UserVoiceBubble.tsx'
      - 'hooks/usePrivateChatSpeech.ts'
      - 'utils/speechToText.ts'
      - 'utils/messageFormat.ts'
      - 'utils/chatPrompts.ts'
      - 'utils/userVoiceMessage.ts'
      - 'utils/userVoiceMessage.test.ts'
      - 'utils/userVoiceMessage.wiring.test.ts'
      - 'utils/userVoiceAudio.test.ts'
      - 'utils/qqBubbleTheme.ts'
      - 'utils/qqBubbleTheme.test.ts'
      - 'components/chat/ChatConstants.ts'
      - 'utils/applyAssistantPostProcessing.ts'
      - 'utils/backupBlobs.ts'
      - '.github/workflows/chat-user-voice-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sully-user-voice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run voice, auto-reply, keyboard and history regression
        run: pnpm exec vitest run utils/userVoiceMessage.test.ts utils/userVoiceAudio.test.ts utils/userVoiceMessage.wiring.test.ts utils/chatAutoReply.test.ts utils/chatKeyboardViewport.test.ts
      - name: Verify built-in QQ CSS conversion, quotes, translated content and media isolation
        run: pnpm exec vitest run utils/qqBubbleTheme.test.ts
      - name: Full TypeScript check (all repository diagnostics)
        continue-on-error: true
        shell: bash
        run: pnpm exec tsc --noEmit --pretty false 2>&1 | tee /tmp/user-voice-tsc.log
      # A pre-existing PostProcessMusicHooks error in applyAssistantPostProcessing.ts
      # predates user voice (confirmed in the Stage 2 CI logs). Full tsc above
      # retains that diagnostic; voice quote behavior is covered by Vitest.
      - name: Gate TypeScript diagnostics in user voice files
        shell: bash
        run: |
          grep -E '^(apps/Chat.tsx|components/chat/(ChatInputArea|MessageItem|UserVoiceBubble).tsx|hooks/usePrivateChatSpeech.ts|utils/(qqBubbleTheme(\.test)?|speechToText|messageFormat|chatPrompts|backupBlobs|userVoiceMessage(\.test|\.wiring\.test)?|userVoiceAudio\.test).ts)[(]' /tmp/user-voice-tsc.log > /tmp/user-voice-target-ts-errors.log || true
          if [ -s /tmp/user-voice-target-ts-errors.log ]; then
            cat /tmp/user-voice-target-ts-errors.log
            exit 1
          fi
          echo "Voice target files have no TypeScript errors; unrelated repository-wide failures remain visible above."
      - name: Verify application build
        run: pnpm build
