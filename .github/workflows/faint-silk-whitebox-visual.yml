name: Faint Silk whitebox native visual
on:
  push:
    branches: [remove-checkphone-vrworld-lifesim]
    paths:
      - 'presets/chat/faint-silk.json'
      - 'utils/builtinWhitebox.ts'
      - 'utils/builtinWhitebox.test.ts'
      - 'components/chat/ChromeCssEditor.tsx'
      - 'tests/faint-silk-whitebox-visual.*'
      - '.github/workflows/faint-silk-whitebox-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faint-silk-whitebox-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests for full preset and isolation
        run: pnpm exec vitest run utils/builtinWhitebox.test.ts utils/chatDecoration.test.ts
      - name: TypeScript check on modified code
        shell: bash
        run: |
          pnpm exec tsc --noEmit --pretty false >/tmp/faint-tsc.txt 2>&1 || true
          grep -E '^(utils/builtinWhitebox(\.test)?\.ts|components/chat/ChromeCssEditor\.tsx|tests/faint-silk-whitebox-visual\.ts)[(]' /tmp/faint-tsc.txt >/tmp/faint-errors.txt || true
          if test -s /tmp/faint-errors.txt; then cat /tmp/faint-errors.txt; exit 1; fi
      - name: Build real native chat preview CSS
        run: pnpm run build:chat-preview
      - name: Install Chinese glyphs for visual QA
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Screenshot actual Chat / Group message components
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vite --host 127.0.0.1 --port 5173 --strictPort >/tmp/faint-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/tests/faint-silk-whitebox-visual.html >/dev/null; then break; fi
            sleep 1
          done
          chrome="${{ steps.chrome.outputs.chrome-path }}"
          "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --window-size=1640,2170 --virtual-time-budget=15000 \
            --dump-dom http://127.0.0.1:5173/tests/faint-silk-whitebox-visual.html > /tmp/faint-dom.txt 2>/tmp/faint-chrome.log || true
          "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars \
            --window-size=1640,2170 --virtual-time-budget=15000 \
            --screenshot="$GITHUB_WORKSPACE/faint-silk-native-chat.png" \
            http://127.0.0.1:5173/tests/faint-silk-whitebox-visual.html
          if ! grep -q 'data-ready="true"' /tmp/faint-dom.txt; then
            grep -o '<output[^>]*>[^<]*</output>' /tmp/faint-dom.txt | head -8 || true
            tail -60 /tmp/faint-vite.log || true
            tail -40 /tmp/faint-chrome.log || true
            exit 1
          fi
          test -s faint-silk-native-chat.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faint-silk-native-chat-screenshot
          path: faint-silk-native-chat.png
          if-no-files-found: ignore
          retention-days: 7
