<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>双人公主抱 · 服装/头发/身高/进出动作 WebGL 视觉验收</title>
<style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#ebe4ed;color:#34303c;font:14px system-ui,sans-serif}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}figure{margin:0;background:#fff;border:1px solid #cabdd3;border-radius:8px;overflow:hidden}figure img{width:100%;display:block;aspect-ratio:4/3;object-fit:contain}figcaption{padding:9px;font-size:12px}output{position:sticky;top:0;background:white;padding:8px;display:block;z-index:2}</style>
</head><body><h1>公主抱 · 实际 3D 模型逐帧检查</h1><output id="status">准备真实骨架、发型和服装 GLB…</output><main class="gallery"></main>
<script type="module">
import * as T from 'three';
import {createVisitor} from '../apps/room3d/chibi/visitor.ts';
import {createSocialScene,socialActions} from '../apps/room3d/chibi/selectedSocial.ts';
import {approvedPresets} from '../apps/room3d/chibi/approvedWardrobe.ts';
import {createRoomFinishPass} from '../apps/room3d/roomFinishPass.js';
import {setCharacterStyle} from '../apps/room3d/chibi/characterStyle.ts';
import {setCharacterRoomLighting,setCharacterRoomTint} from '../apps/room3d/chibi/illustration.ts';
import {ROOM_LIGHT_PHASES,createRoomLightUniforms,updateRoomLightUniforms} from '../apps/room3d/roomLighting.js';
const report={status:'starting',stage:'boot',errors:[],frames:[],images:[],materialImages:[],finishImages:[],finishStats:[],styleImages:[],styleStats:[],phaseImages:[],phaseStats:[],sequences:[],timelines:[],models:[]};
window.__carryVisualAcceptance=report;
const label=document.querySelector('#status');
const stage=s=>{report.stage=s;label.textContent=report.status+' · '+s+' · '+report.images.length+' 张真实 WebGL 画面';};
window.addEventListener('error',e=>report.errors.push(e.message||String(e.error)));
window.addEventListener('unhandledrejection',e=>report.errors.push(String(e.reason)));
function color(hex){const c=document.createElement('canvas');c.width=c.height=472;const x=c.getContext('2d');x.fillStyle=hex;x.fillRect(0,0,472,472);return c;}
async function source(name){const i=new Image();i.src='/like520/parts/'+name+'.png';await i.decode();return i;}
const images=await Promise.all(['fronthair_02','back1_02','back2_03','earhair_01','fronthair_06','back1_04','back2_08','earhair_03'].map(source));
function parts(i){const colors=i?['#e8bfaf','#566b9a','#a25767']:['#e9bca4','#7661a5','#ab6968'];return {skin:color(colors[0]),eyes:color(colors[1]),mouth:color(colors[2]),fronthair:images[i?4:0],back1:images[i?5:1],back2:images[i?6:2],earhair:images[i?7:3],outfit:color('#bac9d6'),outer:color('#cbb5c7')};}
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(420,315,false);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
const scene=new T.Scene();scene.background=new T.Color('#eee9f1');
scene.add(new T.HemisphereLight('#fff9f1','#9991b2',2.5));
const lamp=new T.DirectionalLight('#fff5ec',2.8);lamp.position.set(4,7,5);scene.add(lamp);
const floor=new T.Mesh(new T.PlaneGeometry(12,12),new T.MeshStandardMaterial({color:'#dacfdc',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.035;scene.add(floor);
const camera=new T.OrthographicCamera(-2.55,2.55,1.9125,-1.9125,.1,40);
const view=(kind)=>{const cameras={front:[0,2.7,7.1],back:[0,2.7,-7.1],side:[6.4,2.55,.35],'three-quarter':[3.7,2.8,6.7]};camera.position.set(...cameras[kind]);camera.lookAt(0,1.32,0);camera.updateProjectionMatrix();};
const hairBox=v=>{const box=new T.Box3(),part=new T.Box3();v.root.traverse(o=>{if(o instanceof T.Mesh&&(/hair|wisp|fringe/i.test(o.name)||o.userData.hairConstruction)){part.setFromObject(o);box.union(part);}});return box.isEmpty()?null:{min:box.min.toArray(),max:box.max.toArray()};};
const head=v=>v.rig.bones.head.getWorldPosition(new T.Vector3());
const wardrobeMeshes=v=>{let count=0;v.root.traverse(o=>{if(o.name.startsWith('wardrobe:')&&o.visible)count++});return count;};
const palm=v=>['L','R'].map(s=>v.rig.bones[s+'_hand'].getWorldPosition(new T.Vector3()).toArray());
const next=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
(async()=>{try{
 if(renderer.getContext().isContextLost())throw Error('WebGL context lost');
 const celOnly=new URLSearchParams(location.search).has('cel-only');
 const variants=[{name:'equal',heights:[1,1]},{name:'short-carrier',heights:[.8,1.25]},{name:'tall-carrier',heights:[1.25,.8]}];
 const outfits=[{name:'hoodie',id:'original'},{name:'sailor',id:'sailor'}];
 if(!celOnly)for(const heights of variants)for(const outfit of outfits){
  const pair=[];let runtime;
  try{
   stage('创建 '+heights.name+' / '+outfit.name);
   for(let i=0;i<2;i++){
    const preset=approvedPresets[outfit.id];
    if(!preset)throw Error('No wardrobe preset '+outfit.id);
    const v=await createVisitor(parts(i),{bodyShape:'blank',bodyHeight:heights.heights[i],headSize:i?1.07:1,layers:{},extras:[],wardrobe:preset.items,wardrobeLayering:true,hairColor:i?'#506eac':'#ad7382'});
    if(!v.rig)throw Error('Missing Q rig');if(wardrobeMeshes(v)<2)throw Error('Real wardrobe meshes not mounted '+outfit.name);
    pair.push(v);scene.add(v.root);
   }
   report.models.push({scenario:heights.name,outfit:outfit.name,meshCounts:pair.map(wardrobeMeshes)});
   for(const direction of ['home-princess-carry','home-princess-carried']){
    pair.forEach((v,i)=>{v.root.position.set(0,0,i? .42:-.42);v.root.rotation.y=i?Math.PI:0;v.animate(0,'idle');});
    runtime=createSocialScene(pair.map((visitor,i)=>({id:String(i),visitor})));
    await runtime.start(direction,'0','1');
    const session=runtime.inspect().session;if(!session)throw Error('No active carry session');
    const approach=session.duration-socialActions[direction].duration,records=[],timeSamples=[0,1,1.5,2.5,3.5,4.3,5,6.8,7.8,8.7,9.3,10];
    let standingHipBaseline=null;
    for(const time of timeSamples){
     // Existing player keeps a 0.6s entry blend before sampling source motion.
     runtime.seek(approach+time+.6);
     pair.forEach(v=>v.finishPose());
     const heads=pair.map(head),distance=heads[0].distanceTo(heads[1]);
     const feet=pair.map(v=>Math.min(...['L_toe','R_toe','L_foot','R_foot'].map(n=>v.rig.bones[n].getWorldPosition(new T.Vector3()).y)));
     const feetBySide=pair.map(v=>Object.fromEntries(['L','R'].map(side=>[side,Math.min(
      v.rig.bones[side+'_foot'].getWorldPosition(new T.Vector3()).y,
      v.rig.bones[side+'_toe'].getWorldPosition(new T.Vector3()).y)])));
     const hipHeights=pair.map(v=>v.rig.bones.hips.getWorldPosition(new T.Vector3()).y);
     if(time===0)standingHipBaseline=hipHeights;
     const frame={scenario:heights.name,outfit:outfit.name,direction,time,heads:heads.map(v=>v.toArray()),headDistance:distance,footMin:feet,feetBySide,hipHeights,hair:pair.map(hairBox),palms:pair.map(palm),wardrobe:pair.map(wardrobeMeshes),
      upperArms:pair.map(v=>['L','R'].map(side=>v.rig.bones[side+'_upperArm'].quaternion.toArray()))};
     if(!Number.isFinite(distance)||!feet.every(Number.isFinite)||!frame.heads.flat().every(Number.isFinite))throw Error('Non-finite geometry '+heights.name+'/'+time);
     const carrier=direction==='home-princess-carry'?0:1;
     const floorY=pair[carrier].root.getWorldPosition(new T.Vector3()).y;
     if(feet[carrier]<floorY-.035)throw Error('Carrier foot sank under floor: '+heights.name+' / '+outfit.name+' / '+direction+' / '+time+' => '+(feet[carrier]-floorY).toFixed(3)+'m');
     // Stage acceptance from the actual posed toes, not the phase curve alone:
     // never float before the cradle, hold a real airborne load, then plant
     // both recipient feet before the hands enter their late release window.
     const recipient=1-carrier,clearance=feet[recipient]-floorY;
     // Real WebGL geometry of the offered leg and the carrier's pelvis:
     // this catches the old "both squat in sync" clip despite smooth IK.
     if(time===3.5){
      const recipientFeet=feetBySide[recipient];
      if(recipientFeet.L-recipientFeet.R<.10)throw Error(
       'Missing one-leg offer before lift: '+heights.name+' / '+direction+' => '+JSON.stringify(recipientFeet));
      if(recipientFeet.R-floorY>.13)throw Error(
       'Standing recipient foot left the floor during offer: '+heights.name+' / '+direction);
      if(hipHeights[carrier]<standingHipBaseline[carrier]-.06*heights.heights[carrier])
       throw Error('Carrier deep-squatted during leg offer: '+heights.name+' / '+direction);
     }
     if(time<=2.5&&clearance>.12)throw Error('Premature recipient lift: '+heights.name+' / '+outfit.name+' / '+direction+' / '+time+' => '+clearance.toFixed(3)+'m');
     if(time>=5&&time<=6.8&&clearance<.55)throw Error('Missing supported airborne hold: '+heights.name+' / '+outfit.name+' / '+direction+' / '+time+' => '+clearance.toFixed(3)+'m');
     if(time>=8.7&&clearance>.12)throw Error('Recipient not planted before release: '+heights.name+' / '+outfit.name+' / '+direction+' / '+time+' => '+clearance.toFixed(3)+'m');
     // Q heads are much larger than human heads. The stable hold must not
     // place both head centres on top of each other even if leg IK passes.
     if(heights.name==='equal'&&time>=5&&time<=6.8&&distance<.62)
      throw Error('Overlapping heads in carried hold: '+outfit.name+' / '+direction+' / '+time+' => '+distance.toFixed(3)+'m');
     if(time===0)window.__carryIdleArmPose=frame.upperArms;
     if(time===10){
      for(let i=0;i<2;i++)for(let j=0;j<2;j++){
       const idle=new T.Quaternion().fromArray(window.__carryIdleArmPose[i][j]);
       const ended=new T.Quaternion().fromArray(frame.upperArms[i][j]);
       if(idle.angleTo(ended)>.05)throw Error('T-pose or residual arm preparation at exit: '+heights.name+' / '+direction+' / '+i+' / '+j+' '+idle.angleTo(ended).toFixed(3));
      }
     }
     if(frame.wardrobe.some(n=>n<2))throw Error('Wardrobe disappeared during carry');
     records.push(frame);
     for(const angle of ['front','side','three-quarter','back']){
      stage('渲染 '+heights.name+'/'+outfit.name+'/'+direction+'/'+time+'/'+angle);
      view(angle);renderer.render(scene,camera);
      const img=document.createElement('img'),fig=document.createElement('figure'),caption=document.createElement('figcaption');
      const name=[heights.name,outfit.name,direction.replace('home-princess-',''),String(time).replace('.','-'),angle].join('-');
      img.src=renderer.domElement.toDataURL('image/png');img.alt=name;
      caption.textContent=heights.name+' · '+outfit.name+' · '+direction+' · '+time+'s · '+angle+' · 头中心距离 '+distance.toFixed(2)+'m';
      fig.append(img,caption);document.querySelector('.gallery').append(fig);
      report.images.push({name});report.frames.push({...frame,name,angle});
      await next();
     }
    }
    // Full 10 Hz image sequences for both role directions and front/side.
    // Numeric 30/60 Hz traces complement, but do not replace, visual review.
    if(heights.name==='equal'&&outfit.name==='hoodie'){
     const traces={fps30:[],fps60:[]};
     for(const fps of [30,60])for(let i=0;i<=10*fps;i++){
      const t=i/fps;runtime.seek(approach+t+.6);pair.forEach(v=>v.finishPose());
      traces['fps'+fps].push({time:t,
       hips:pair.map(v=>v.rig.bones.hips.getWorldPosition(new T.Vector3()).toArray()),
       feet:pair.map(v=>Math.min(...['L_foot','R_foot','L_toe','R_toe'].map(n=>v.rig.bones[n].getWorldPosition(new T.Vector3()).y)))});
     }
     // A numeric "pass" at sparse keyframes can hide a one-frame teleport.
     // Assert 60Hz pelvis continuity specifically across toe-lock handoff.
     for(let i=1;i<traces.fps60.length;i++){
      const cur=traces.fps60[i],prev=traces.fps60[i-1];
      if(cur.time<3.8||cur.time>4.4)continue;
      const carried=direction==='home-princess-carry'?1:0;
      const delta=new T.Vector3().fromArray(cur.hips[carried]).distanceTo(
       new T.Vector3().fromArray(prev.hips[carried]));
      if(delta>.035)throw Error('Abrupt seated-to-airborne pelvis snap at '+
       cur.time.toFixed(3)+'s: '+delta.toFixed(3)+'m in 1/60s');
     }
     for(let i=0;i<=100;i++){
      const t=i/10;runtime.seek(approach+t+.6);pair.forEach(v=>v.finishPose());
      for(const angle of ['front','side']){
       view(angle);renderer.render(scene,camera);
       const name=['timeline',direction.replace('home-princess-',''),String(i).padStart(3,'0'),angle].join('-');
       const img=document.createElement('img'),fig=document.createElement('figure'),caption=document.createElement('figcaption');
       img.src=renderer.domElement.toDataURL('image/png');img.alt=name;
       caption.textContent=direction+' · '+t.toFixed(1)+'s · '+angle;
       fig.append(img,caption);document.querySelector('.gallery').append(fig);
       report.images.push({name});report.frames.push({scenario:heights.name,outfit:outfit.name,direction,time:t,name,angle,continuous:true});
       await next();
      }
     }
     report.timelines.push({direction,scenario:heights.name,outfit:outfit.name,fps:10,frameCount:101,angles:['front','side'],traces});
    }
    report.sequences.push({scenario:heights.name,outfit:outfit.name,direction,frames:records});
    runtime.cancel();runtime=undefined;
    if(pair.some(v=>v.root.position.y>.05))throw Error('Navigation root lifted after cancel');
   }
  }finally{runtime?.cancel();for(const v of pair){scene.remove(v.root);v.dispose();}}
 }

 // Extra real-WebGL material acceptance: dark, pale and warm hair on the
 // original hair sheets, three skin tones, both dark and light wardrobes.
 // Keep the 980 motion frames unchanged for exact prior-run comparisons.
 const [testEyes,testMouth,testMarks]=await Promise.all(['eyes_01','mouth_01','facemark_01'].map(source));
 const materialCases=[
  {id:'black-fair-dark',hair:'#20242b',skin:'#efc8b4',outfit:'sailor'},
  {id:'black-deep-light',hair:'#22252d',skin:'#956750',outfit:'original'},
  {id:'ash-deep-dark',hair:'#c9bbac',skin:'#8f6351',outfit:'sailor'},
  {id:'copper-medium-light',hair:'#b96b46',skin:'#c9967b',outfit:'original'},
 ];
 const styleGallery=document.createElement('main');styleGallery.className='style-comparison';document.body.append(styleGallery);
 const styleScreenshot=(name)=>{
  const fig=document.createElement('figure'),img=document.createElement('img');
  img.src=renderer.domElement.toDataURL('image/png');img.alt=name;fig.append(img);styleGallery.append(fig);
  report.styleImages.push({name});
  const canvas=document.createElement('canvas');canvas.width=renderer.domElement.width;canvas.height=renderer.domElement.height;
  const ctx=canvas.getContext('2d');ctx.drawImage(renderer.domElement,0,0);
  return ctx.getImageData(0,0,canvas.width,canvas.height).data;
 };
 const materialGallery=document.createElement('main');materialGallery.className='materials';document.body.append(materialGallery);
 const finishedGallery=document.createElement('main');finishedGallery.className='finish-comparison';document.body.append(finishedGallery);
 const finishPass=createRoomFinishPass(renderer);
 const finishScreenshot=(name)=>{
  const img=document.createElement('img'),fig=document.createElement('figure');
  img.src=renderer.domElement.toDataURL('image/png');img.alt=name;fig.append(img);
  finishedGallery.append(fig);report.finishImages.push({name});
  const sample=document.createElement('canvas');sample.width=renderer.domElement.width;sample.height=renderer.domElement.height;
  const ctx=sample.getContext('2d');ctx.drawImage(renderer.domElement,0,0);return ctx.getImageData(0,0,sample.width,sample.height).data;
 };

 renderer.setSize(700,525,false);renderer.setPixelRatio(1);
 for(const variant of materialCases){
  const p=parts(0);p.skin=color(variant.skin);p.eyes=testEyes;p.mouth=testMouth;p.facemark=testMarks;
  const preset=approvedPresets[variant.outfit];
  let actor;
  try{
   actor=await createVisitor(p,{bodyShape:'blank',bodyHeight:1,headSize:1.04,layers:{},extras:[],
    wardrobe:preset.items,wardrobeLayering:true,hairColor:variant.hair,skinColor:variant.skin});
   if(!actor.rig||wardrobeMeshes(actor)<2)throw Error('Missing real materials '+variant.id);
   scene.add(actor.root);actor.animate(0,'idle');actor.finishPose();
   const strand=actor.root.getObjectByName('front-hair-sheet');
   const head=actor.rig.bones.head;
   if(!strand||!head||!head.children.includes(strand.parent))throw Error('Hair not attached to real head bone '+variant.id);
   const restHeadX=head.rotation.x;
   for(const [pose,tilt] of [['neutral',0],['down',.23],['up',-.23]]){
    // Rotate the actual rig head bone: hair, face artwork and skull follow together.
    head.rotation.x=restHeadX+tilt;actor.finishPose();
    for(const angle of ['front','side','three-quarter']){
     stage('材质检查 '+variant.id+'/'+pose+'/'+angle);
     view(angle);renderer.render(scene,camera);
     const name=['material',variant.id,pose,angle].join('-');
     const img=document.createElement('img'),fig=document.createElement('figure');
     img.src=renderer.domElement.toDataURL('image/png');img.alt=name;
     fig.append(img);materialGallery.append(fig);
     report.materialImages.push({name,skin:variant.skin,hair:variant.hair,wardrobe:variant.outfit,pose,angle});
     await next();
    }
   }

   // No filters in this comparison: pure material response with identical
   // character, clothes, camera, light, and skeletal pose for each shot.
   head.rotation.x=restHeadX;actor.finishPose();view('three-quarter');
   setCharacterStyle('modern');renderer.render(scene,camera);
   const orig=styleScreenshot('style-'+variant.id+'-original');
   setCharacterStyle('illustrated');renderer.render(scene,camera);
   const drawn=styleScreenshot('style-'+variant.id+'-illustrated');
   setCharacterStyle('modern');renderer.render(scene,camera);
   const restored=styleScreenshot('style-'+variant.id+'-restored');
   let styleTotal=0,styleChanged=0,styleReversible=0;
   for(let px=0;px<orig.length;px+=4){
    const diff=(Math.abs(orig[px]-drawn[px])+Math.abs(orig[px+1]-drawn[px+1])+Math.abs(orig[px+2]-drawn[px+2]))/3;
    const revers=(Math.abs(orig[px]-restored[px])+Math.abs(orig[px+1]-restored[px+1])+Math.abs(orig[px+2]-restored[px+2]))/3;
    styleTotal+=diff;if(diff>.5)styleChanged++;styleReversible=Math.max(styleReversible,revers);
   }
   const styleMean=styleTotal/(orig.length/4),styleFraction=styleChanged/(orig.length/4);
   report.styleStats.push({variant:variant.id,mean:styleMean,fraction:styleFraction,maxRestoreDifference:styleReversible});
   if(styleMean<.05||styleMean>12||styleFraction<.005||styleFraction>.75||styleReversible>.01)
    throw Error('Original look not preserved or cel shader ineffective '+variant.id+': '+JSON.stringify({mean:styleMean,fraction:styleFraction,reversible:styleReversible}));
   if(variant.id==='black-fair-dark'){
    // Preserve the actual shared room colour uniforms across all four daylight
    // phases and verify switching the optional style cannot remove existing light.
    const phases=['morning','day','sunset','night'];
    const lighting=createRoomLightUniforms();lighting.roomShadeSoftness={value:.35};
    setCharacterRoomLighting(actor.root,lighting);
    for(const phase of phases){
      const profile=ROOM_LIGHT_PHASES[phase];
      updateRoomLightUniforms(lighting,profile);
      setCharacterRoomTint(actor.root,profile.character);
      setCharacterStyle('modern');renderer.render(scene,camera);
      const oldFrame=styleScreenshot('phase-'+phase+'-original');
      report.phaseImages.push('phase-'+phase+'-original');
      setCharacterStyle('illustrated');renderer.render(scene,camera);
      const newFrame=styleScreenshot('phase-'+phase+'-illustrated');
      report.phaseImages.push('phase-'+phase+'-illustrated');
      setCharacterStyle('modern');renderer.render(scene,camera);
      const restoredFrame=styleScreenshot('phase-'+phase+'-restored');
      report.phaseImages.push('phase-'+phase+'-restored');
      let delta=0,maxRestored=0;
      for(let pix=0;pix<oldFrame.length;pix+=4){
       delta+=Math.abs(oldFrame[pix]-newFrame[pix])+Math.abs(oldFrame[pix+1]-newFrame[pix+1])+Math.abs(oldFrame[pix+2]-newFrame[pix+2]);
       maxRestored=Math.max(maxRestored,Math.abs(oldFrame[pix]-restoredFrame[pix]),Math.abs(oldFrame[pix+1]-restoredFrame[pix+1]),Math.abs(oldFrame[pix+2]-restoredFrame[pix+2]));
      }
      report.phaseStats.push({phase,mean:delta/3/(oldFrame.length/4),maxRestored});
      if(maxRestored>.01)throw Error('Original '+phase+' lighting no longer restores: '+maxRestored);
    }
    updateRoomLightUniforms(lighting,ROOM_LIGHT_PHASES.day);
    setCharacterRoomTint(actor.root,ROOM_LIGHT_PHASES.day.character);
   }
   // Frame-perfect comparison on the real hair, face, wardrobe and ACES renderer.
   // Both images include the ORIGINAL room finish. Only the optional detail differs.
   head.rotation.x=restHeadX;actor.finishPose();view('three-quarter');
   renderer.render(scene,camera);finishPass.render('day',{baseFinish:true,detail:0});
   const baseline=finishScreenshot('finish-'+variant.id+'-original');
   renderer.render(scene,camera);finishPass.render('day',{baseFinish:true,detail:.55});
   const enhanced=finishScreenshot('finish-'+variant.id+'-enhanced');
   let changed=0,sum=0;
   for(let k=0;k<baseline.length;k+=4){
    const d=(Math.abs(baseline[k]-enhanced[k])+Math.abs(baseline[k+1]-enhanced[k+1])+Math.abs(baseline[k+2]-enhanced[k+2]))/3;
    if(d>.5)changed++;sum+=d;
   }
   const mean=sum/(baseline.length/4),fraction=changed/(baseline.length/4);
   // The floor/backdrop fills most pixels. Measure the real actor separately
   // so a visible but restrained material detail pass isn't marked invisible.
   const sw=renderer.domElement.width,sh=renderer.domElement.height;
   const x0=Math.round(sw*.37),x1=Math.round(sw*.65),y0=Math.round(sh*.12),y1=Math.round(sh*.82);
   let subjectTotal=0,subjectChanged=0,subjectPixels=0;
   for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){
    const k=(y*sw+x)*4;
    const d=(Math.abs(baseline[k]-enhanced[k])+Math.abs(baseline[k+1]-enhanced[k+1])+Math.abs(baseline[k+2]-enhanced[k+2]))/3;
    subjectTotal+=d;subjectPixels++;if(d>.5)subjectChanged++;
   }
   const subjectMean=subjectTotal/subjectPixels,subjectFraction=subjectChanged/subjectPixels;
   report.finishStats.push({variant:variant.id,meanDifference:mean,changedFraction:fraction,subjectMean,subjectFraction});
   // Guard both excessive global changes and insufficient character detail.
   if(mean<.10||mean>12||fraction<.025||fraction>.85||subjectMean<.50||subjectMean>18||subjectFraction<.10)
    throw Error('Unsafe or invisible detail filter '+variant.id+': '+JSON.stringify({mean,fraction,subjectMean,subjectFraction}));
  }finally{if(actor){scene.remove(actor.root);actor.dispose();}}
 }
 if(report.materialImages.length!==36||report.finishImages.length!==8||report.styleImages.length!==24||report.phaseImages.length!==12)throw Error('Incomplete material, finish and cel shader A/B '+report.materialImages.length+'/'+report.finishImages.length+'/'+report.styleImages.length);
 finishPass.dispose();
 if(!celOnly&&(report.images.length!==980||report.timelines.length!==2))throw Error('Incomplete four-angle/continuous sequences '+report.images.length);
 report.status='pass';stage('完整生成 '+report.images.length+' 张真实 WebGL 帧；需人工审阅穿模和发丝遮挡');
}catch(error){report.errors.push(String(error));report.status='fail';stage('错误');}
})();
