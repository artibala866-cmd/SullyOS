<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Home3D photo export real WebGL acceptance</title>
<style>body{margin:0;padding:10px;background:#221928;color:white;font:13px system-ui}#out{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}figure{margin:0}img{display:block;max-width:100%;max-height:270px;object-fit:contain}figcaption{margin:5px}</style></head><body><h1>Home3D original and paper photo exports</h1><output id="status">Starting</output><main id="out"></main><script type="module">
import * as T from 'three';
import {photoFrames,photoSize,photoDrag} from '../apps/room3d/photoFrame.ts';
import {photoCaptureAspect,composePhoto,isPhotoPaper} from '../apps/room3d/photoComposition.ts';
import {defaultPhotoLettering,loadPhotoFont} from '../apps/room3d/photoLettering.ts';
import {createPhotoRenderer} from '../apps/room3d/photoRenderer.ts';
import {photoLooks} from '../apps/room3d/photoEffects.ts';
const report={status:'starting',formats:[],errors:[],png:true,filters:true};
window.__photoExportSmoke=report;
const status=document.getElementById('status'),canvas=document.createElement('canvas');
const renderer=new T.WebGLRenderer({canvas,antialias:false,preserveDrawingBuffer:true});
renderer.setSize(640,360,false);renderer.setPixelRatio(1);
const scene=new T.Scene();scene.background=new T.Color('#382849');
const cube=new T.Mesh(new T.BoxGeometry(2,1.8,1.6),new T.MeshStandardMaterial({color:'#a9d2dc',roughness:.6}));
cube.rotation.set(.12,.52,.08);scene.add(cube);
const sphere=new T.Mesh(new T.SphereGeometry(.45,16,12),new T.MeshStandardMaterial({color:'#f8b266'}));
sphere.position.set(1.1,1.2,.9);scene.add(sphere);
scene.add(new T.HemisphereLight('#ffffff','#5c426c',2.8));
const cam=new T.OrthographicCamera(-3,3,2,-2,.01,30);cam.position.set(3,2.8,8);cam.lookAt(0,0,0);
const original={left:cam.left,right:cam.right,width:640,height:360};
const photo=createPhotoRenderer(renderer,cam,()=>renderer.render(scene,cam));
try{
 for(const [id,frame] of Object.entries(photoFrames)){
  status.textContent='Render '+id;
  const out=document.createElement('canvas');
  const paper=isPhotoPaper(id),source=paper?document.createElement('canvas'):out;
  const cameraAspect=paper?photoCaptureAspect(id):frame.aspect;
  photo.render(source,id==='landscape'?photoLooks.daylight:photoLooks.natural,{aspect:cameraAspect,quality:'export'});
  if(paper){
   const lettering=defaultPhotoLettering(id);
   lettering.title='3D 家园合影';lettering.footer='镜头里的我们';
   await loadPhotoFont(lettering);
   composePhoto(source,out,id,'export',lettering);
  }
  const target=photoSize(frame.aspect,'export');
  if(out.width!==target.width||out.height!==target.height)throw Error(id+': actual canvas dimensions '+out.width+'x'+out.height);
  if(Math.abs(out.width/out.height-frame.aspect)>.002)throw Error(id+': aspect mismatch');
  const context=out.getContext('2d'),pixel=context.getImageData(Math.floor(out.width/2),Math.floor(out.height/2),1,1).data;
  if(pixel[3]<250)throw Error(id+': transparent/blank canvas');
  const blob=await new Promise(resolve=>out.toBlob(resolve,'image/png'));
  if(!blob||blob.type!=='image/png'||blob.size<1000)throw Error(id+': PNG export invalid');
  const bitmap=await createImageBitmap(blob);
  if(bitmap.width!==target.width||bitmap.height!==target.height)throw Error(id+': actual PNG dimensions mismatch');
  bitmap.close();
  const url=URL.createObjectURL(blob),img=document.createElement('img'),fig=document.createElement('figure'),caption=document.createElement('figcaption');
  img.src=url;img.alt=id;caption.textContent=id+' · '+out.width+'×'+out.height+' · '+Math.round(blob.size/1024)+'KiB';fig.append(img,caption);document.getElementById('out').append(fig);
  report.formats.push({id,width:out.width,height:out.height,pngBytes:blob.size});
  // Filter-only changes never cause a second scene capture.
  const before=photo.inspect().captures;
  photo.render(source,photoLooks.neon,{aspect:cameraAspect,quality:'export'});
  if(photo.inspect().captures!==before)throw Error(id+': changing filters redrew WebGL scene');
  await new Promise(resolve=>setTimeout(resolve,10));
 }
 if(photoDrag(12,8,true).dx!==8)throw Error('Rotated camera gesture mismatch');
 photo.dispose();
 if(renderer.getSize(new T.Vector2()).x!==original.width||cam.left!==original.left||cam.right!==original.right)throw Error('Photo mode failed to restore scene dimensions');
 if(report.formats.length!==8)throw Error('Incomplete original/paper frame coverage');
 report.status='pass';status.textContent='PASS · eight real WebGL PNGs, original camera restored';
}catch(e){report.status='fail';report.errors.push(String(e?.stack||e));status.textContent='FAIL '+e;console.error(e);}
finally{renderer.dispose();renderer.forceContextLoss();}
</script></body></html>
