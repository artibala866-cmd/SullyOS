<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Home3D furniture WebGL smoke</title>
<style>html,body{margin:0;width:100%;height:100%;background:#f2e7ee}#host{height:100vh;width:100vw}#result{position:fixed;left:0;bottom:0;z-index:9999;background:rgba(255,255,255,.86);padding:5px;font:11px monospace}</style></head>
<body><div id="host"></div><output id="result" data-status="starting">Home3D loading…</output>
<script type="module">
import '../apps/room3d/editor.css';
import {createHome} from '../apps/room3d/model.js';
import {createVisitor} from '../apps/room3d/chibi/visitor.ts';
import {mountHomeEditor} from '../apps/room3d/editor.js';
const report={status:'starting',stage:'boot',errors:[],actions:[],seat:false,canvas:false,webgl:false,virtualAdvance:false};
window.__home3dSmoke=report;
const set=(stage,status)=>{report.stage=stage;if(status)report.status=status;const out=document.getElementById('result');out.dataset.status=report.status;out.textContent=JSON.stringify(report);};
window.addEventListener('error',e=>{report.errors.push(e.message||String(e.error));set('browser error');});
window.addEventListener('unhandledrejection',e=>{report.errors.push(String(e.reason));set('unhandled rejection');});
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function texture(color){
 const canvas=document.createElement('canvas');canvas.width=canvas.height=472;
 const ctx=canvas.getContext('2d');ctx.fillStyle=color;ctx.fillRect(0,0,472,472);return canvas;
}
(async()=>{
 let editor=null;
 try{
  set('catalog');
  const catalog=await fetch('/room3d/catalog.json').then(r=>{if(!r.ok)throw Error('catalog '+r.status);return r.json();});
  const home=createHome(catalog),room=home.rooms[0];
  room.items=[
   {id:'smoke-chair',assetId:'chair',x:0,y:.18,z:0,rotation:0,color:null,stored:false},
   {id:'smoke-plush',assetId:'bedroom_rabbit',x:2.1,y:.18,z:-.5,rotation:0,color:null,stored:false}
  ];
  // SwiftShader can render only a few frames/second; preserve actual gameplay speed in this CI fixture.
  localStorage.setItem('sully-home3d-quality','eco');
  set('mount editor');
  editor=await mountHomeEditor(document.getElementById('host'),{
   assetBase:new URL('/room3d/',location.href).href,initialState:home,
   onChange:()=>{},onBack:()=>{},timeZone:'Asia/Shanghai'
  });
  const canvas=document.querySelector('.h3-stage canvas');
  report.canvas=!!canvas&&canvas.width>0&&canvas.height>0;
  const gl=canvas?.getContext('webgl2');
  report.webgl=!!gl&&!gl.isContextLost();
  if(!report.canvas||!report.webgl)throw Error('WebGL drawing buffer was not created');
  set('build classic visitor');
  const keys=['skin','eyes','mouth','fronthair','earhair','back1','back2','outfit','outer','decor','facemark'];
  const parts=Object.fromEntries(keys.map((k,i)=>[k,texture(i<2?'#dfac91':i<6?'#7e636e':'#8a9db4')]));
  const person=await createVisitor(parts,{bodyShape:'classic',layers:{}});
  editor.setVisitor(person);
  await sleep(800);
  const actions=editor.getHomeScene().actions;
  report.actions=actions.filter(a=>['sit','stand','sleep','water'].includes(a.kind)).map(a=>a.kind);
  const target=actions.find(a=>a.kind==='sit');
  if(!target)throw Error('No feasible sit action in smoke room');
  set('begin sit action');
  report.request=editor.performHomeAction(target.id,'model');
  report.visibility=document.visibilityState;report.samples=[];
  if(report.request==='unavailable')throw Error('Sit action was unavailable despite menu availability');
  // Observe several actual frames, then step the same controller at 20Hz to
  // avoid treating the CI machine's software GPU frame rate as action failure.
  for(let i=0;i<35;i++){
   await sleep(100);
   const state=editor.inspect();
   if(i%10===0)report.samples.push({
    step:i,walking:state.walking,seatChange:state.seatChange,
    chibiSeat:state.chibiSeat,visitorLocation:state.visitorLocation,
    position:state.residentPositions?.[0]?.position,sceneBusy:editor.getHomeScene().busy,
    canvas:document.querySelector('.h3-stage canvas')?.width
   });
   if(state.chibiSeat&&!state.seatChange){report.seat=true;break;}
  }
  if(!report.seat){
   report.virtualAdvance=true;
   editor.advancePets(12);
   const state=editor.inspect();
   report.virtualState={walking:state.walking,seatChange:state.seatChange,
     seat:state.chibiSeat,position:state.residentPositions?.[0]?.position};
   report.seat=!!state.chibiSeat&&!state.seatChange;
  }
  if(!report.seat)throw Error('Character failed seat transition even under 20Hz controlled simulation');
  // A seat is not completed until the same actor can rise, reclaim its floor
  // access and sit down again without a stale occupied slot.
  const stand=editor.getHomeScene().actions.find(a=>a.kind==='stand');
  if(!stand)throw Error('No stand action after seating');
  report.standRequest=editor.performHomeAction(stand.id,'model');
  editor.advancePets(3);
  let post=editor.inspect();
  report.exit=!post.chibiSeat&&!post.seatChange;
  if(!report.exit)throw Error('Seated character could not exit via existing stand controller');
  const repeat=editor.getHomeScene().actions.find(a=>a.kind==='sit');
  if(!repeat)throw Error('Seat remained unavailable after standing');
  report.repeatRequest=editor.performHomeAction(repeat.id,'model');
  editor.advancePets(12);
  post=editor.inspect();
  report.repeat=!!post.chibiSeat&&!post.seatChange;
  if(!report.repeat)throw Error('Seat could not be reused after exit');
  // Repeat the complete seat contract with the second (skeletal) character.
  const lastStand=editor.getHomeScene().actions.find(a=>a.kind==='stand');
  if(!lastStand)throw Error('No exit before changing character rig');
  editor.performHomeAction(lastStand.id,'model');editor.advancePets(3);
  if(editor.inspect().chibiSeat)throw Error('Legacy visitor still occupies seat after rising');
  set('build skeletal visitor');
  const skeletal=await createVisitor(parts,{bodyShape:'blank',layers:{}});
  report.skeletalRig=!!skeletal.rig;
  if(!report.skeletalRig)throw Error('Second body has no skeleton');
  editor.setVisitor(skeletal);
  const second=editor.getHomeScene().actions.find(a=>a.kind==='sit');
  if(!second)throw Error('Skeletal resident lacks a feasible chair action');
  report.skeletalRequest=editor.performHomeAction(second.id,'model');
  if(report.skeletalRequest==='unavailable')throw Error('Skeletal chair action unavailable');
  editor.advancePets(12);
  const secondState=editor.inspect();
  report.skeletalSeat=!!secondState.chibiSeat&&!secondState.seatChange;
  if(!report.skeletalSeat)throw Error('Skeletal character could not finish chair entry');
  const standSecond=editor.getHomeScene().actions.find(a=>a.kind==='stand');
  if(!standSecond)throw Error('Skeletal seated actor cannot request exit');
  editor.performHomeAction(standSecond.id,'model');editor.advancePets(3);
  report.skeletalExit=!editor.inspect().chibiSeat&&!editor.inspect().seatChange;
  if(!report.skeletalExit)throw Error('Skeletal character could not safely exit chair');
  // Independent real WebGL bedroom: the regular bed must still have a
  // reachable bed edge, continuous entry and an unblocked standing exit.
  editor.dispose();
  const bedroom=createHome(catalog);
  bedroom.rooms[0].items=[{id:'smoke-single-bed',assetId:'bedroom_single_bed',
    x:0,y:.18,z:0,rotation:0,color:null,stored:false}];
  set('mount single-bed WebGL fixture');
  editor=await mountHomeEditor(document.getElementById('host'),{
   assetBase:new URL('/room3d/',location.href).href,initialState:bedroom,
   onChange:()=>{},onBack:()=>{},timeZone:'Asia/Shanghai'
  });
  const bedPerson=await createVisitor(parts,{bodyShape:'blank',layers:{}});
  editor.setVisitor(bedPerson);
  const sleeps=editor.getHomeScene().actions.filter(a=>a.kind==='sleep');
  report.bedOptions=sleeps.length;
  if(!sleeps.length)throw Error('A supported single bed has no accessible sleep option');
  report.bedRequest=editor.performHomeAction(sleeps[0].id,'model');
  if(report.bedRequest==='unavailable')throw Error('Bed option was advertised but could not start');
  editor.advancePets(22);
  const rested=editor.inspect();
  report.bedRest=!!rested.chibiSeat?.bed&&!rested.seatChange;
  report.bedRestPosition=rested.residentPositions?.[0]?.position;
  if(!report.bedRest)throw Error('Skeletal resident never settled onto the supported single bed');
  const standBed=editor.getHomeScene().actions.find(a=>a.kind==='stand');
  if(!standBed)throw Error('Lying resident cannot request bed exit');
  report.bedExitRequest=editor.performHomeAction(standBed.id,'model');
  editor.advancePets(12);
  const awake=editor.inspect();
  report.bedExit=!awake.chibiSeat&&!awake.seatChange;
  report.bedExitPosition=awake.residentPositions?.[0]?.position;
  if(!report.bedExit)throw Error('Skeletal resident could not exit bed without teleport');
  // Repeat with the original non-skeletal body; the shared bed edge must
  // remain accessible, and classic's authored root offset must stay finite.
  set('classic single-bed passage');
  const classicBed=await createVisitor(parts,{bodyShape:'classic',layers:{}});
  editor.setVisitor(classicBed);
  const legacySleep=editor.getHomeScene().actions.find(a=>a.kind==='sleep');
  if(!legacySleep)throw Error('Classic resident has no feasible single-bed entry');
  report.classicBedRequest=editor.performHomeAction(legacySleep.id,'model');
  if(report.classicBedRequest==='unavailable')throw Error('Classic bed action refused unexpectedly');
  editor.advancePets(22);
  report.classicBedRest=!!editor.inspect().chibiSeat?.bed&&!editor.inspect().seatChange;
  if(!report.classicBedRest)throw Error('Classic body did not finish entry to bed');
  const classicStand=editor.getHomeScene().actions.find(a=>a.kind==='stand');
  if(!classicStand)throw Error('Classic sleeping actor cannot request exit');
  editor.performHomeAction(classicStand.id,'model');editor.advancePets(12);
  const classicAwake=editor.inspect();
  report.classicBedExit=!classicAwake.chibiSeat&&!classicAwake.seatChange;
  report.classicBedExitPosition=classicAwake.residentPositions?.[0]?.position;
  if(!report.classicBedExit)throw Error('Classic body did not complete safe bed exit');
  const scene=editor.inspect();
  report.posture=scene.chibiPosture;
  report.position=scene.residentPositions?.[0]?.position?.map(n=>Math.round(n*100)/100);
  report.status='pass';set('rendered and seated','pass');
 }catch(error){report.errors.push(String(error?.stack||error));set('failed','fail');}
})();
</script></body></html>
